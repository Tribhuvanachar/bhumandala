<html lang="sa">

<style>
/* =========================================================================
   SARVAMŪLA — landing page.

   The vandana fills the first screen: the name of the library, what it is,
   and his portrait at the centre. Nothing of the library is reachable until
   respects have been paid.

   Below it, one band per contributor. Each band says who and what; the long
   detail — the acknowledgements especially — opens in a panel, so the page
   itself stays readable.

   Motion stays slow, 4s to 20s cycles, and switches off entirely under
   prefers-reduced-motion.
   ========================================================================= */

:root {
  --bg-deep:    #0B0907;
  --bg-mid:     #171009;
  --bg-warm:    #2A1608;
  --bg-panel:   #14100C;

  --saffron:    #F2820C;
  --saffron-lt: #FFB24D;
  --gold:       #E8B24D;
  --gold-soft:  #D9B87A;

  --text:       #F3E7D4;
  --text-dim:   #C0AC90;
  --text-faint: #8B7A63;

  --hairline:   rgba(232,178,77,.22);
  --hairline-2: rgba(232,178,77,.11);

  --font-sa:    'Tiro Devanagari Sanskrit', 'Noto Serif Devanagari', 'Noto Sans Devanagari', serif;
  --font-ui:    'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;

  --ease:      cubic-bezier(.22,.61,.36,1);
  --ease-soft: cubic-bezier(.4,0,.2,1);

  --vh: 1vh;
}
@supports (height: 1dvh) { :root { --vh: 1dvh; } }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: var(--font-ui);
  background:
    radial-gradient(120% 60% at 50% 0%, var(--bg-warm) 0%, var(--bg-mid) 38%, var(--bg-deep) 72%),
    var(--bg-deep);
  color: var(--text);
  overflow-x: hidden;
}
body.modal-open { overflow: hidden; }

#veil {
  position: fixed; inset: 0; z-index: 200; pointer-events: none;
  background: var(--bg-deep); opacity: 0;
  transition: opacity .7s var(--ease-soft);
}
body.leaving #veil { opacity: 1; }

/* =========================================================================
   1. HERO
   ========================================================================= */

.hero {
  position: relative;
  min-height: calc(100 * var(--vh));
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: clamp(8px, 1.25 * var(--vh), 15px);
  padding: calc(20px + env(safe-area-inset-top)) 22px calc(30px + env(safe-area-inset-bottom));
  overflow: hidden; text-align: center;
}

.mandala {
  position: absolute; left: 50%; top: 44%;
  width: min(150 * var(--vh), 150vw); aspect-ratio: 1;
  transform: translate(-50%,-50%);
  opacity: .055; pointer-events: none;
  -webkit-mask-image: radial-gradient(closest-side, #000 30%, transparent 72%);
          mask-image: radial-gradient(closest-side, #000 30%, transparent 72%);
  animation: turn 150s linear infinite;
}
@keyframes turn { to { transform: translate(-50%,-50%) rotate(360deg); } }

.vignette {
  position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(115% 78% at 50% 44%, transparent 44%, rgba(0,0,0,.5) 84%, rgba(0,0,0,.8) 100%);
}
.smoke {
  position: absolute; bottom: -12%; width: 34vmin; height: 90vmin;
  pointer-events: none; opacity: .15; filter: blur(26px);
  background: radial-gradient(closest-side, rgba(255,214,160,.55), transparent 70%);
  animation: drift 19s var(--ease-soft) infinite;
}
.smoke.l { left: 4%; }
.smoke.r { right: 4%; animation-duration: 23s; animation-delay: -8s; }
@keyframes drift {
  0%   { transform: translate3d(0,10%,0) scale(.9);    opacity: 0; }
  30%  { opacity: .18; }
  100% { transform: translate3d(4vmin,-40%,0) scale(1.35); opacity: 0; }
}

.masthead, .hero .om, .portrait-wrap, .guru-block, .hero-actions {
  position: relative; z-index: 2;
}

/* --- masthead: the one and only place the library is named --- */
.masthead { display: flex; flex-direction: column; align-items: center; gap: 5px; max-width: 900px; margin-top: auto; }
.brand-latin {
  margin: 0;
  font-family: var(--font-serif);
  font-size: clamp(28px, 3.5vw, 46px); font-weight: 500;
  color: var(--gold); letter-spacing: .04em; line-height: 1.1;
  text-shadow: 0 0 40px rgba(232,178,77,.32);
}
.brand-tagline {
  margin: 5px auto 0; max-width: 72ch;
  font-size: clamp(12px, 1.05vw, 13.5px); line-height: 1.62; color: var(--text-dim);
}

/* --- portrait --- */
.om {
  font-family: var(--font-sa);
  font-size: clamp(22px, 2.4vw, 30px); line-height: 1; color: var(--gold);
  animation: pulse 6s var(--ease-soft) infinite;
}
@keyframes pulse {
  0%,100% { opacity: .7; text-shadow: 0 0 18px rgba(232,178,77,.3); }
  50%     { opacity: 1;  text-shadow: 0 0 34px rgba(232,178,77,.6); }
}

.portrait-wrap {
  position: relative;
  width: clamp(150px, 17.5 * var(--vh), 232px);
  display: flex; align-items: flex-end; justify-content: center;
}
.halo {
  position: absolute; left: 50%; top: 46%;
  width: 180%; aspect-ratio: 1; transform: translate(-50%,-50%);
  pointer-events: none; filter: blur(6px);
  background:
    radial-gradient(closest-side, rgba(255,178,77,.30), transparent 66%),
    radial-gradient(closest-side, rgba(242,130,12,.22), transparent 78%);
  animation: breathe 7s var(--ease-soft) infinite;
}
@keyframes breathe {
  0%,100% { transform: translate(-50%,-50%) scale(1);    opacity: .8; }
  50%     { transform: translate(-50%,-50%) scale(1.07); opacity: 1; }
}
.halo-ring {
  position: absolute; inset: -6% -7% -5%;
  border-radius: 50% 50% 18px 18px / 40% 40% 5% 5%;
  border: 1px solid rgba(232,178,77,.28);
  box-shadow: 0 0 60px rgba(242,130,12,.2);
  pointer-events: none;
  animation: breathe-ring 9s var(--ease-soft) infinite;
}
@keyframes breathe-ring {
  0%,100% { transform: scale(1);     opacity: .55; }
  50%     { transform: scale(1.025); opacity: .95; }
}

.frame {
  position: relative; width: 100%; aspect-ratio: var(--frame-ratio, 2 / 3);
  border-radius: 50% 50% 14px 14px / 40% 40% 5% 5%;
  overflow: hidden;
  background: linear-gradient(180deg, #241505, #120B04);
  box-shadow:
    0 0 0 1px rgba(232,178,77,.34),
    0 0 0 7px rgba(232,178,77,.07),
    0 30px 70px rgba(0,0,0,.6),
    inset 0 0 60px rgba(0,0,0,.5);
}
.frame img {
  width: 100%; height: 100%; display: block;
  object-fit: cover; object-position: center 50%;
  filter: saturate(1.06) contrast(1.04) brightness(1.02);
  animation: kenburns 24s var(--ease-soft) infinite alternate;
  -webkit-mask-image: linear-gradient(180deg, #000 88%, rgba(0,0,0,.86) 96%, transparent 100%);
          mask-image: linear-gradient(180deg, #000 88%, rgba(0,0,0,.86) 96%, transparent 100%);
}
@keyframes kenburns {
  from { transform: scale(1)     translateY(0); }
  to   { transform: scale(1.055) translateY(-1.4%); }
}
.frame::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(70% 46% at 46% 26%, rgba(255,196,120,.16), transparent 70%),
    radial-gradient(95% 78% at 52% 52%, transparent 46%, rgba(11,9,7,.34) 78%, rgba(11,9,7,.72) 100%),
    linear-gradient(180deg, rgba(11,9,7,.6) 0%, transparent 20%, transparent 88%, rgba(11,9,7,.55) 100%);
}

/* His feet — where the offering lands. */
.pada {
  position: absolute; left: var(--pada-x, 70%); bottom: -6px;
  width: var(--pada-w, 50%); height: 72px;
  transform: translateX(-50%); cursor: pointer; z-index: 3;
  border-radius: 50%;
  background: radial-gradient(60% 100% at 50% 50%, rgba(242,130,12,.22), transparent 72%);
  transition: background .4s var(--ease-soft);
}
.pada:hover { background: radial-gradient(60% 100% at 50% 50%, rgba(255,178,77,.34), transparent 74%); }
.pada:focus-visible { outline: 2px solid var(--gold); outline-offset: 6px; border-radius: 999px; }

.ripple {
  position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px;
  border-radius: 50%; border: 1px solid rgba(255,246,230,.8); pointer-events: none;
  animation: ripple-out 1.5s var(--ease) forwards;
}
@keyframes ripple-out {
  from { transform: scale(.4);  opacity: .9; }
  to   { transform: scale(6.5); opacity: 0; }
}

/* Namaskāra: several rise together and dissolve, not one. */
.pranam-mark {
  position: absolute; bottom: 8px; left: 50%;
  font-size: 30px; line-height: 1; pointer-events: none;
  filter: drop-shadow(0 0 20px rgba(255,196,120,.7));
  animation: pranam-rise 2.4s var(--ease) forwards;
}
@keyframes pranam-rise {
  0%   { opacity: 0; transform: translate(-50%, 10px) scale(.55); }
  18%  { opacity: 1; transform: translate(-50%, -6px) scale(1); }
  60%  { opacity: .95; transform: translate(-50%, -52px) scale(.98); }
  100% { opacity: 0; transform: translate(-50%, -116px) scale(.8); }
}

/* --- his name and the verse --- */
.guru-block { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.guru-sa {
  font-family: var(--font-sa);
  font-size: clamp(19px, 1.95vw, 26px); line-height: 1.35;
  color: var(--saffron-lt); text-shadow: 0 0 30px rgba(242,130,12,.35);
}
.guru-latin {
  font-family: var(--font-serif); font-style: italic;
  font-size: clamp(14px, 1.4vw, 19px); color: var(--gold-soft); letter-spacing: .05em;
}
.guru-title {
  font-size: clamp(9px, .9vw, 11px);
  letter-spacing: .26em; text-transform: uppercase; color: var(--text-faint);
}
.verse {
  font-family: var(--font-sa);
  font-size: clamp(12.5px, 1.1vw, 15px); line-height: 1.8;
  color: var(--text); max-width: 52ch; opacity: .94;
}
.verse-tr {
  font-family: var(--font-serif); font-style: italic;
  font-size: clamp(11px, 1vw, 13.5px); color: var(--text-faint);
  max-width: 58ch; margin-top: 3px; line-height: 1.5;
}

.rule { display: flex; align-items: center; justify-content: center; gap: 12px; width: min(300px, 66vw); margin: 3px 0; }
.rule::before, .rule::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(232,178,77,.4), transparent); }
.rule i { width: 6px; height: 6px; transform: rotate(45deg); background: var(--gold); opacity: .85; box-shadow: 0 0 12px rgba(232,178,77,.6); }

/* A quiet text link, used under his name and inside each band. */
.more-link {
  display: inline-flex; align-items: center; gap: 5px;
  background: none; border: 0; cursor: pointer; padding: 3px 2px;
  font-family: var(--font-ui); font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--gold-soft); border-bottom: 1px solid rgba(232,178,77,.3);
  transition: color .3s var(--ease-soft), border-color .3s var(--ease-soft);
}
.more-link:hover { color: var(--saffron-lt); border-color: rgba(232,178,77,.75); }
.more-link:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.more-link-sm { font-size: 9.5px; letter-spacing: .16em; gap: 4px; padding: 2px 1px; opacity: .8; }
.more-link-sm:hover { opacity: 1; }
.more-link .arrow { transition: transform .3s var(--ease); }
.more-link:hover .arrow { transform: translateX(3px); }

/* --- obeisance and entry --- */
.hero-actions { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 2px; }
.hint { font-size: clamp(11px, 1.05vw, 13px); color: var(--text-faint); letter-spacing: .03em; }
.act-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

.btn {
  font-family: var(--font-ui);
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 20px; border-radius: 999px;
  font-size: clamp(11.5px, 1.05vw, 13.5px); font-weight: 500; letter-spacing: .04em;
  cursor: pointer; color: var(--text);
  border: 1px solid var(--hairline);
  background: rgba(255,255,255,.035);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  transition: transform .3s var(--ease), background .3s var(--ease-soft),
              border-color .3s var(--ease-soft), box-shadow .4s var(--ease-soft),
              opacity .5s var(--ease-soft), color .3s var(--ease-soft);
}
.btn:hover  { transform: translateY(-2px); border-color: rgba(232,178,77,.55); background: rgba(255,255,255,.07); }
.btn:active { transform: translateY(0) scale(.98); }
.btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }

.btn-obeisance {
  border-color: rgba(242,130,12,.5);
  background: linear-gradient(180deg, rgba(242,130,12,.2), rgba(196,71,26,.16));
  color: #FFE6C4; box-shadow: 0 0 30px rgba(242,130,12,.16);
}
.btn-obeisance:hover { box-shadow: 0 0 44px rgba(242,130,12,.32); }

/* Locked, the entry button says what to do rather than sitting mute — which
   is why there is no separate explanatory line under it. */
.btn-enter { padding: 14px 30px; font-size: clamp(12.5px, 1.15vw, 14.5px); opacity: .5; pointer-events: none; }
.btn-enter.ready {
  opacity: 1; pointer-events: auto;
  border-color: rgba(232,178,77,.62);
  background: linear-gradient(180deg, rgba(232,178,77,.2), rgba(242,130,12,.12));
  color: #FFF1D8;
  animation: arrive .9s var(--ease) both, glow 3.6s var(--ease-soft) 1s infinite;
}
@keyframes arrive { from { transform: translateY(10px) scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes glow {
  0%,100% { box-shadow: 0 0 22px rgba(232,178,77,.18); }
  50%     { box-shadow: 0 0 46px rgba(232,178,77,.4); }
}
.btn-enter .arrow { transition: transform .3s var(--ease); }
.btn-enter:hover .arrow { transform: translateX(4px); }


/* --- the sections popover, reachable from the first screen --- */
.cue {
  position: relative; z-index: 2;
  display: inline-flex; align-items: center; gap: 9px;
  margin: auto auto 0; padding: 11px 22px;
  border: 1px solid rgba(232,178,77,.4); border-radius: 999px;
  background: rgba(255,255,255,.04);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  text-decoration: none;
  font-family: var(--font-ui); font-size: clamp(11px, 1vw, 12.5px);
  letter-spacing: .18em; text-transform: uppercase;
  color: var(--gold-soft);
  transition: color .3s var(--ease-soft), border-color .3s var(--ease-soft),
              background .3s var(--ease-soft), transform .3s var(--ease);
}
.cue:hover { color: #FFF1D8; border-color: rgba(232,178,77,.75); background: rgba(255,255,255,.08); transform: translateY(-2px); }
.cue:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }
.cue span:last-child { font-size: 15px; line-height: 1; animation: nudge 2.6s var(--ease-soft) infinite; }
@keyframes nudge { 0%,100% { transform: translateY(0); } 50% { transform: translateY(4px); } }

/* Flowers fall inside the hero, so a settled heap stays on his feet. */
.petal-layer { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 4; }
.petal { position: absolute; will-change: transform, opacity; }
.petal svg, .settled svg { display: block; filter: drop-shadow(0 2px 6px rgba(0,0,0,.5)); }
.settled { position: absolute; z-index: 3; pointer-events: none; opacity: 0; animation: settle .7s var(--ease) forwards; }
@keyframes settle {
  from { opacity: 0; transform: translateY(-8px) scale(.85); }
  to   { opacity: .92; transform: none; }
}

/* =========================================================================
   2. CONTRIBUTOR BANDS
   ========================================================================= */

.band { position: relative; z-index: 2; padding: clamp(40px, 5.4vw, 72px) 22px; }
.inner { max-width: 1120px; margin: 0 auto; }

.person { border-top: 1px solid var(--hairline-2); }
.person:nth-of-type(even) { background: rgba(255,255,255,.014); }

.person-head { display: flex; align-items: flex-start; gap: clamp(14px, 2vw, 22px); }
.person-icon {
  flex: 0 0 auto; width: 60px; height: 60px; border-radius: 50%;
  border: 1px solid rgba(232,178,77,.4);
  display: grid; place-items: center; color: var(--gold);
  box-shadow: inset 0 0 24px rgba(242,130,12,.14), 0 0 24px rgba(242,130,12,.1);
}
.person-eyebrow {
  font-size: clamp(10.5px, 1vw, 12px); letter-spacing: .2em; text-transform: uppercase;
  color: var(--text-faint); margin-bottom: 6px;
}
.person-name {
  font-family: var(--font-serif);
  font-size: clamp(21px, 2.4vw, 30px); font-weight: 600; color: var(--saffron-lt); line-height: 1.2;
}
.person-name span { font-family: var(--font-ui); font-size: .5em; font-weight: 400; color: var(--text-faint); letter-spacing: .04em; }
.person-meta { margin-top: 7px; font-size: 12.5px; line-height: 1.65; color: var(--text-dim); }
.person-blurb {
  margin: 18px 0 0; font-size: clamp(13.5px, 1.25vw, 15px); line-height: 1.8; color: var(--text-dim);
  max-width: 76ch;
}
.person-actions { margin-top: 16px; }

.person-items { list-style: none; margin: 20px 0 0; padding: 0; display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.person-items li {
  border: 1px solid var(--hairline-2); border-radius: 12px; padding: 14px 16px;
  font-size: 13.5px; color: var(--text); background: rgba(255,255,255,.02);
}
.person-items li small { display: block; margin-top: 4px; font-size: 12px; color: var(--text-faint); line-height: 1.6; }

.person-todo {
  margin-top: 18px; font-size: 12px; line-height: 1.65; color: var(--text-faint);
  border: 1px dashed rgba(232,178,77,.28); border-radius: 12px; padding: 12px 15px;
}

/* --- footer --- */
.site-foot { position: relative; z-index: 2; padding: 34px 22px calc(40px + env(safe-area-inset-bottom)); text-align: center; }
.mantra {
  font-family: var(--font-sa);
  font-size: clamp(13px, 1.4vw, 18px); color: var(--gold);
  letter-spacing: .04em; opacity: .92; line-height: 1.9;
}
.mantra.second { font-size: clamp(11.5px, 1.15vw, 15px); opacity: .8; margin-top: 9px; }
.mantra-latin {
  font-family: var(--font-serif); font-style: italic;
  font-size: clamp(10.5px, 1vw, 12.5px); color: var(--text-faint);
  letter-spacing: .06em; margin-top: 4px;
}

/* =========================================================================
   3. PANELS
   ========================================================================= */

.sheet-wrap {
  position: fixed; inset: 0; z-index: 150;
  display: grid; place-items: center; padding: 18px;
  background: rgba(5,4,3,.8);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  opacity: 0; visibility: hidden;
  transition: opacity .35s var(--ease-soft), visibility 0s linear .35s;
}
.sheet-wrap.open { opacity: 1; visibility: visible; transition-delay: 0s; }

.sheet {
  width: min(920px, 100%); max-height: calc(100 * var(--vh) - 36px);
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  border: 1px solid rgba(232,178,77,.28); border-radius: 20px;
  background: linear-gradient(180deg, #1B1410, var(--bg-panel));
  box-shadow: 0 40px 90px rgba(0,0,0,.7);
  padding: clamp(20px, 2.8vw, 36px);
  transform: translateY(18px) scale(.98);
  transition: transform .4s var(--ease);
}
.sheet-wrap.open .sheet { transform: none; }

.sheet-close {
  position: sticky; top: 0; float: right;
  width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
  border: 1px solid var(--hairline); background: rgba(20,16,12,.9);
  color: var(--text-dim); font-size: 17px; line-height: 1;
  display: grid; place-items: center;
  transition: border-color .3s var(--ease-soft), color .3s var(--ease-soft);
}
.sheet-close:hover { border-color: rgba(232,178,77,.6); color: var(--text); }

.sheet-eyebrow { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 8px; }
.sheet h3 {
  font-family: var(--font-serif);
  font-size: clamp(21px, 2.4vw, 29px); font-weight: 500; color: var(--gold); margin: 0 0 4px;
}
.sheet > p { font-size: 13.5px; line-height: 1.78; color: var(--text-dim); max-width: 80ch; }

.reverence {
  font-family: var(--font-serif); font-style: italic;
  font-size: clamp(13.5px, 1.35vw, 16.5px); line-height: 1.72; color: var(--gold-soft);
  border-left: 2px solid rgba(232,178,77,.35); padding: 2px 0 2px 16px;
  margin: 16px 0 24px; max-width: 80ch;
}

/* One acknowledgement group. */
.ack { margin-top: 24px; }
.ack-head { display: flex; align-items: center; gap: 11px; margin-bottom: 12px; }
.ack-head .ico { color: var(--gold); line-height: 0; flex: 0 0 auto; }
.ack-head h4 {
  font-family: var(--font-serif); font-weight: 600;
  font-size: clamp(15px, 1.5vw, 18px); color: var(--saffron-lt); margin: 0;
}
.ack-head .line { flex: 1; height: 1px; background: linear-gradient(90deg, rgba(232,178,77,.28), transparent); }

.ack-entries { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; grid-template-columns: repeat(auto-fit, minmax(268px, 1fr)); }
.ack-entries li {
  border: 1px solid var(--hairline-2); border-radius: 12px; padding: 12px 15px;
  background: rgba(255,255,255,.022);
}
.ack-entries b { display: block; font-family: var(--font-serif); font-weight: 600; font-size: 15px; color: var(--text); letter-spacing: .01em; }
.ack-body {
  --ack-lines: 3;
  max-height: calc(var(--ack-lines) * 1.6 * 12px);
  min-height: calc(2 * 1.6 * 12px);
  overflow: hidden;
  transition: max-height .45s var(--ease);
}
.ack-body.open { max-height: 60em; }
.ack-more {
  margin-top: 8px; padding: 0; border: 0; background: none; cursor: pointer;
  font-family: var(--font-ui); font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--gold-soft); border-bottom: 1px solid rgba(232,178,77,.3);
  transition: color .3s var(--ease-soft), border-color .3s var(--ease-soft);
}
.ack-more:hover { color: var(--saffron-lt); border-color: rgba(232,178,77,.75); }
.ack-more:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

.ack-entries small { display: block; margin-top: 4px; font-size: 12px; line-height: 1.6; color: var(--text-faint); }
.ack-entries small.also {
  margin-top: 7px; padding-top: 7px;
  border-top: 1px solid var(--hairline-2);
  font-size: 11.5px; opacity: .85;
}

/* A plain roll of names, where there is nothing to say beside each one. */
.ack-names { display: flex; flex-wrap: wrap; gap: 8px; }
.ack-names span {
  border: 1px solid var(--hairline-2); border-radius: 999px; padding: 8px 15px;
  font-size: 13px; color: var(--text); background: rgba(255,255,255,.022);
}

.closing {
  display: flex; align-items: center; gap: 16px;
  margin-top: 26px; padding: 18px 22px;
  border: 1px solid rgba(232,178,77,.26); border-radius: 16px;
  background: linear-gradient(180deg, rgba(242,130,12,.09), rgba(242,130,12,.03));
}
.closing .ico { color: var(--gold); line-height: 0; flex: 0 0 auto; opacity: .9; }
.closing p {
  margin: 0; font-family: var(--font-serif); font-style: italic;
  font-size: clamp(14px, 1.4vw, 17.5px); line-height: 1.65; color: var(--gold-soft);
}

.sheet-todo {
  margin-top: 20px; font-size: 12px; line-height: 1.65; color: var(--text-faint);
  border: 1px dashed rgba(232,178,77,.28); border-radius: 12px; padding: 12px 15px;
}

/* =========================================================================
   4. RESPONSIVE
   ========================================================================= */

@media (max-width: 900px) {
  .person-head { flex-direction: column; align-items: center; text-align: center; }
  .person-blurb { text-align: center; margin-left: auto; margin-right: auto; }
  .person-actions { text-align: center; }
  .ack-head { justify-content: center; }
  .ack-head .line { display: none; }
  .ack-names { justify-content: center; }
  .closing { flex-direction: column; text-align: center; gap: 10px; }
}

@media (max-width: 700px) {
  .hero { gap: clamp(8px, 1.3 * var(--vh), 16px); }
  .brand-latin { font-size: clamp(24px, 6.4vw, 34px); }
  .brand-tagline { font-size: 12px; line-height: 1.6; }
  .verse { font-size: 13px; line-height: 1.85; }
  .verse-tr { display: none; }
  .btn { padding: 11px 16px; }
  .btn-enter { padding: 12px 24px; }
  .portrait-wrap { width: clamp(150px, 19 * var(--vh), 210px); }
}
@media (max-width: 700px) and (max-height: 720px) {
  .brand-tagline { display: none; }
  .guru-title { display: none; }
  .portrait-wrap { width: clamp(126px, 17 * var(--vh), 180px); }
  .cue { padding: 9px 16px; font-size: 10px; letter-spacing: .14em; gap: 7px; }
}

/* A laptop is wide but often short — 1280x720 and the like. The vw-based
   type stays large there while the height does not, so the entry button
   slips under the fold unless this tier pulls it back. */
@media (min-width: 900px) and (max-height: 820px) {
  .hero { gap: 6px; padding-bottom: 20px; }

  .brand-tagline { font-size: 12px; max-width: 84ch; }
  .portrait-wrap { width: clamp(128px, 15 * var(--vh), 190px); }
  .verse { font-size: 13px; line-height: 1.7; }
  .verse-tr { display: none; }
}

@media (max-width: 700px) and (max-height: 640px) {
  .om { display: none; }
  .portrait-wrap { width: clamp(110px, 15 * var(--vh), 150px); }
  .verse { font-size: 12px; line-height: 1.6; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .mandala, .smoke, .om, .halo, .halo-ring, .frame img,

  .petal, .ripple, .pranam-mark { display: none !important; }
  .btn, .sheet, .sheet-wrap, .cue-pop, #veil { transition-duration: .01ms !important; }
}

    anjali: '<path d="M12 20.4c-2.9 0-4.9-2-4.9-4.7 0-3.1 2-6.8 4.9-10.1v14.8Z"/><path d="M12 20.4c2.9 0 4.9-2 4.9-4.7 0-3.1-2-6.8-4.9-10.1v14.8Z"/><path d="M7.4 13.2 4.6 15.5"/><path d="m16.6 13.2 2.8 2.3"/>',
    home:   '<path d="M3.4 10.8 12 4.1l8.6 6.7"/><path d="M5.8 10v9.8h12.4V10"/><path d="M9.9 19.8v-5.2h4.2v5.2"/>',
    lamp:   '<path d="M3.8 14.2h16.4c0 3.4-3.7 5.7-8.2 5.7s-8.2-2.3-8.2-5.7Z"/><path d="M12 13.8c-1.7-1.9-2.5-3.4-2.5-4.8 0-1.7 1-3 2.5-4.2 1.5 1.2 2.5 2.5 2.5 4.2 0 1.4-.8 2.9-2.5 4.8Z"/>',
    seed:   '<path d="M12 21c0-4.6 1.4-7.6 4.2-9 .4 4.8-.9 7.8-4.2 9Z"/><path d="M12 21c0-4.6-1.4-7.6-4.2-9-.4 4.8.9 7.8 4.2 9Z"/><path d="M12 21v-4"/><path d="M12 12.6c0-3.4.9-6 2.6-7.8"/>'
  };
  function icon(name, size) {
    const d = ICONS[name];
    if (!d) return '';
    return '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size + '" fill="none" ' +
           'stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" ' +
           'aria-hidden="true">' + d + '</svg>';
  }

  /* A pārijāta blossom: five white petals around a saffron tube. Drawn rather
     than a single petal shape, because pārijāta falls whole. */
  function flowerSvg(size) {
    const petal = pick(cfg.flowers.petalColors);
    const heart = pick(cfg.flowers.heartColors);
    let g = '';
    for (let i = 0; i < 5; i++) {
      g += `<ellipse cx="12" cy="7" rx="3.3" ry="5.2" fill="${petal}"
             transform="rotate(${i * 72} 12 12)"/>`;
    }
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24">
      <g opacity=".97">${g}</g>
      <circle cx="12" cy="12" r="2.5" fill="${heart}"/>
      <circle cx="12" cy="12" r="1.1" fill="${petal}" opacity=".5"/>
    </svg>`;
  }

  /* ---------------------------------------------------------- render ---- */
  function render() {
    $('brandLatin').textContent   = cfg.brand.latin;
    $('brandTagline').textContent = cfg.brand.tagline;

    const photo = $('photo');
    photo.src = cfg.photo.src;
    photo.alt = cfg.photo.alt || '';
    photo.style.objectPosition = cfg.photo.objectPosition || 'center 50%';
    document.querySelector('.frame').style.setProperty('--frame-ratio', cfg.photo.frameRatio || '2 / 3');
    const pada = $('pada');
    pada.style.setProperty('--pada-x', cfg.photo.padaCenterX || '50%');
    pada.style.setProperty('--pada-w', cfg.photo.padaWidth || '74%');

    $('guruSa').textContent        = cfg.guru.nameSanskrit;
    $('guruLatin').textContent     = cfg.guru.nameLatin;
    $('guruTitle').textContent     = cfg.guru.title;
    $('guruMoreLabel').textContent = cfg.guru.moreLabel;
    $('verse').innerHTML           = cfg.vandana.sanskrit;
    $('verseTr').textContent       = cfg.vandana.transliteration;

    $('hint').textContent        = cfg.labels.hint;
    $('offerIcon').innerHTML     = flowerSvg(15);
    $('offerLabel').textContent  = cfg.labels.offerButton;
    $('pranamLabel').textContent = cfg.labels.pranamButton;
    $('enterLabel').textContent  = cfg.labels.enterLocked;
    $('cueLabel').textContent    = cfg.labels.sectionsCue;

    $('mantras').innerHTML = cfg.footer.lines.map(function (l, i) {
      return `<div class="mantra${i ? ' second' : ''}">${esc(l.sa)}</div>` +
             (l.latin ? `<div class="mantra-latin">${esc(l.latin)}</div>` : '');
    }).join('');

    // Mandala spokes, drawn rather than written into the markup.
    let d = '';
    for (let i = 0; i < 24; i++) {
      const a = (i / 24) * Math.PI * 2;
      d += `M${200 + Math.cos(a) * 60} ${200 + Math.sin(a) * 60}L${200 + Math.cos(a) * 168} ${200 + Math.sin(a) * 168}`;
    }
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', d);
    $('spokes').appendChild(path);

    renderSections();
    if (!cfg.requireOffering) unlock();
  }

  function renderSections() {
    $('sections').innerHTML = cfg.sections.map(function (sec) {
      const meta = (sec.meta || []).map(m => esc(m)).join('<br>');

      let html = `<section class="band person" id="${esc(sec.id)}"><div class="inner">
        <div class="person-head">
          <div class="person-icon" aria-hidden="true">${icon(sec.icon, 28)}</div>
          <div>
            <div class="person-eyebrow">${esc(sec.eyebrow)}</div>
            <div class="person-name">${esc(sec.name)}${sec.sub ? ` <span>${esc(sec.sub)}</span>` : ''}</div>
            ${meta ? `<div class="person-meta">${meta}</div>` : ''}
          </div>
        </div>
        ${[].concat(sec.blurb).map(t => `<p class="person-blurb">${esc(t)}</p>`).join('')}`;

      if (sec.items) {
        html += '<ul class="person-items">' + sec.items.map(function (i) {
          return `<li>${esc(i.name)}${i.note ? `<small>${esc(i.note)}</small>` : ''}</li>`;
        }).join('') + '</ul>';
      }

      if (sec.panel) {
        html += `<div class="person-actions">
          <button class="more-link" data-panel="${esc(sec.panel)}">
            ${esc(sec.moreLabel || 'Know More')} <span class="arrow" aria-hidden="true">→</span>
          </button></div>`;
      }

      if (sec.todo) html += `<p class="person-todo">${esc(sec.todo)}</p>`;
      return html + '</div></section>';
    }).join('');
  }

  /* ----------------------------------------------------------- panels --- */
  function panelHtml(key) {
    const p = cfg.panels[key];
    if (!p) return '';

    let html = `<button class="sheet-close" data-close aria-label="Close">✕</button>
      <div class="sheet-eyebrow">${esc(p.eyebrow)}</div>
      <h3 id="sheetTitle">${esc(p.title)}</h3>`;

    if (p.reverence) html += `<div class="reverence">${esc(p.reverence)}</div>`;
    if (p.body)      html += `<p>${esc(p.body)}</p>`;

    (p.groups || []).forEach(function (g) {
      html += `<div class="ack">
        <div class="ack-head">
          <span class="ico">${icon(g.icon, 22)}</span>
          <h4>${esc(g.heading)}</h4>
          <span class="line" aria-hidden="true"></span>
        </div>`;

      if (g.entries) {
        html += '<ul class="ack-entries">' + g.entries.map(function (e) {
          return `<li><b>${esc(e.name)}</b><div class="ack-body">` +
                 (e.note ? `<small>${esc(e.note)}</small>` : '') +
                 (e.also ? `<small class="also">${esc(e.also)}</small>` : '') +
                 '</div></li>';
        }).join('') + '</ul>';
      }
      if (g.names) {
        html += '<div class="ack-names">' + g.names.map(n => `<span>${esc(n)}</span>`).join('') + '</div>';
      }
      html += '</div>';
    });

    return html;
  }

  /* These notes vary from four words to a paragraph, which left the cards
     at wildly different heights. Each is clamped to a few lines and given a
     "Read more" — but only where there is genuinely something hidden, so a
     one-line note never grows a pointless control. Measured after the panel
     is on screen, since a collapsed element has no height to measure. */
  function applyReadMore(root) {
    root.querySelectorAll('.ack-body').forEach(function (body) {
      if (body.scrollHeight <= body.clientHeight + 2) return;
      const btn = document.createElement('button');
      btn.className = 'ack-more';
      btn.type = 'button';
      btn.textContent = cfg.labels.readMore;
      btn.addEventListener('click', function () {
        const open = body.classList.toggle('open');
        btn.textContent = open ? cfg.labels.readLess : cfg.labels.readMore;
      });
      body.after(btn);
    });
  }

  function panelTail(p, html) {
    if (p.closing) {
      html += `<div class="closing">
        <span class="ico" aria-hidden="true">${icon('lotus', 26)}</span>
        <p>${esc(p.closing)}</p>
      </div>`;
    }
    if (p.todo) html += `<p class="sheet-todo">${esc(p.todo)}</p>`;
    return html;
  }

  let lastFocus = null;
  function openPanel(key) {
    const html = panelTail(cfg.panels[key], panelHtml(key));
    if (!html) return;
    lastFocus = document.activeElement;
    $('sheet').innerHTML = html;
    $('sheet').scrollTop = 0;
    $('sheetWrap').classList.add('open');
    document.body.classList.add('modal-open');
    applyReadMore($('sheet'));
    const close = $('sheet').querySelector('[data-close]');
    if (close) close.focus({ preventScroll: true });
  }
  function closePanel() {
    $('sheetWrap').classList.remove('open');
    document.body.classList.remove('modal-open');
    if (lastFocus) lastFocus.focus({ preventScroll: true });
  }

  /* ---------------------------------------------------------- flowers --- */
  // Coordinates stay relative to the hero, not the viewport, so a settled
  // heap stays on his feet once the page is scrolled.
  function heroPoint(clientX, clientY) {
    const h = $('hero').getBoundingClientRect();
    return { x: clientX - h.left, y: clientY - h.top };
  }

  function offer(clientX, clientY) {
    const r = $('pada').getBoundingClientRect();
    const target = heroPoint(r.left + r.width / 2, r.top + r.height / 2);
    const origin = heroPoint(clientX, clientY);

    offerings++;
    ripple();

    if (!reduced) {
      const n = cfg.flowers.countPerOffering;
      for (let i = 0; i < n; i++) rainFlower(origin, target, i, n, r.width);
    }
    if (cfg.requireOffering && offerings >= cfg.minOfferings) unlock();
  }

  function pranam() {
    offerings++;
    ripple();
    if (!reduced) {
      // Several rise together rather than one — a salutation, not a single
      // gesture.
      const n = cfg.pranam.count;
      for (let i = 0; i < n; i++) {
        const g = document.createElement('div');
        g.className = 'pranam-mark';
        g.textContent = '🙏';
        g.style.marginLeft = ((i - (n - 1) / 2) * 34 + (Math.random() - 0.5) * 12) + 'px';
        g.style.fontSize = (22 + Math.random() * 13) + 'px';
        g.style.animationDelay = (i * 130 + Math.random() * 90) + 'ms';
        g.style.animationDuration = (2200 + Math.random() * 700) + 'ms';
        $('pada').appendChild(g);
        setTimeout(() => g.remove(), 3400);
      }
    }
    if (cfg.requireOffering && offerings >= cfg.minOfferings) unlock();
  }

  function rainFlower(origin, target, i, n, padaW) {
    const size = 11 + Math.random() * 10;

    const outer = document.createElement('div');
    outer.className = 'petal';
    const inner = document.createElement('div');
    inner.innerHTML = flowerSvg(size);
    outer.appendChild(inner);

    // Fan out, so a burst reads as a handful released together rather than a
    // vertical column.
    const spread = (i / n - 0.5) * 190;
    const sx = origin.x + spread + (Math.random() - 0.5) * 40;
    const sy = origin.y - 40 - Math.random() * 90;
    const ex = target.x + (Math.random() - 0.5) * Math.max(80, padaW * 0.8);
    const ey = target.y + (Math.random() - 0.5) * 26;

    outer.style.left = sx + 'px';
    outer.style.top  = sy + 'px';
    $('petals').appendChild(outer);

    const dur = 1500 + Math.random() * 1400;
    const delay = i * 44 + Math.random() * 170;

    outer.animate([
      { transform: 'translate(0,0)', opacity: 0 },
      { transform: `translate(${(ex - sx) * .45}px, ${(ey - sy) * .40}px)`, opacity: 1, offset: .30 },
      { transform: `translate(${(ex - sx) * .82}px, ${(ey - sy) * .80}px)`, opacity: 1, offset: .75 },
      { transform: `translate(${ex - sx}px, ${ey - sy}px)`, opacity: .95 }
    ], { duration: dur, delay, easing: 'cubic-bezier(.35,.05,.5,1)', fill: 'forwards' });

    inner.animate([
      { transform: 'translateX(0) rotate(0deg)' },
      { transform: `translateX(${(Math.random() > .5 ? 1 : -1) * (14 + Math.random() * 20)}px) rotate(${100 + Math.random() * 140}deg)` },
      { transform: `translateX(0) rotate(${220 + Math.random() * 220}deg)` }
    ], { duration: dur, delay, easing: 'ease-in-out', fill: 'forwards' });

    setTimeout(function () {
      outer.remove();
      settle(ex, ey, size);
    }, dur + delay);
  }

  function settle(x, y, size) {
    const s = document.createElement('div');
    s.className = 'settled';
    s.style.left = x + 'px';
    s.style.top  = y + 'px';
    s.innerHTML  = flowerSvg(size * .9);
    s.firstChild.style.transform = `rotate(${Math.random() * 360}deg)`;
    $('petals').appendChild(s);
    const all = $('petals').querySelectorAll('.settled');
    if (all.length > cfg.flowers.maxSettled) all[0].remove();
  }

  function ripple() {
    if (reduced) return;
    const r = document.createElement('div');
    r.className = 'ripple';
    $('pada').appendChild(r);
    setTimeout(() => r.remove(), 1600);
  }

  /* ------------------------------------------------------------ gate ---- */
  function unlock() {
    const btn = $('enterBtn');
    if (btn.classList.contains('ready')) return;
    btn.classList.add('ready');
    btn.setAttribute('aria-disabled', 'false');
    $('enterLabel').textContent = cfg.labels.enterReady;
  }

  function destination() {
    const fallback = cfg.enterUrl || '';
    let next;
    try { next = new URLSearchParams(location.search).get('next'); } catch (e) { return fallback; }
    if (!next) return fallback;
    let url;
    try { url = new URL(next, location.href); } catch (e) { return fallback; }
    // Same-origin only. An absolute URL elsewhere, or //elsewhere, is someone
    // trying to use this page as an open redirect.
    if (url.origin !== location.origin) return fallback;
    if (url.pathname === location.pathname) return fallback;
    return url.pathname + url.search + url.hash;
  }

  function markPassed() {
    try { sessionStorage.setItem(cfg.passKey, String(Date.now())); } catch (e) {}
  }

  function enter() {
    if (cfg.requireOffering && offerings < cfg.minOfferings) return;
    markPassed();
    document.body.classList.add('leaving');
    const target = destination();
    if (target) setTimeout(function () { window.location.href = target; }, 620);
  }

  /* ------------------------------------------------------------ bind ---- */
  function bind() {
    $('offerBtn').addEventListener('click', function (ev) {
      const r = ev.currentTarget.getBoundingClientRect();
      offer(r.left + r.width / 2, r.top);
    });
    $('pranamBtn').addEventListener('click', pranam);
    $('pada').addEventListener('click', function (ev) {
      offer(ev.clientX || window.innerWidth / 2, (ev.clientY || 0) - 120);
    });
    $('pada').addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' || ev.key === ' ') {
        ev.preventDefault();
        const r = $('pada').getBoundingClientRect();
        offer(r.left + r.width / 2, r.top - 120);
      }
    });
    $('enterBtn').addEventListener('click', enter);

    document.addEventListener('click', function (ev) {
      const opener = ev.target.closest('[data-panel]');
      if (opener) openPanel(opener.getAttribute('data-panel'));
    });

    $('sheetWrap').addEventListener('click', function (ev) {
      if (ev.target === $('sheetWrap') || ev.target.closest('[data-close]')) closePanel();
    });
    document.addEventListener('keydown', function (ev) {
      if (ev.key !== 'Escape') return;
      if ($('sheetWrap').classList.contains('open')) closePanel();
    });
  }

  render();
  bind();

  window.dgeVandana = { openPanel, closePanel, enter, get offerings() { return offerings; } };
})();
</script>
</body>
</html>
