<!-- =====================================================================
     HERO
     ===================================================================== -->
<header class="hero" id="hero">
  <svg class="mandala" viewBox="0 0 400 400" aria-hidden="true">
    <g fill="none" stroke="#E8B24D" stroke-width=".6">
      <circle cx="200" cy="200" r="60"/><circle cx="200" cy="200" r="96"/>
      <circle cx="200" cy="200" r="132"/><circle cx="200" cy="200" r="168"/>
      <g id="spokes"></g>
    </g>
  </svg>
  <div class="smoke l" aria-hidden="true"></div>
  <div class="smoke r" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="petal-layer" id="petals" aria-hidden="true"></div>

  <div class="masthead">
    <h1  class="brand-latin"   id="brandLatin" data-edit="brand.latin"></h1>
    <p   class="brand-tagline" id="brandTagline" data-edit="brand.tagline"></p>
    <button class="tagline-more" id="taglineMore" hidden></button>
  </div>

  <div class="om" aria-hidden="true">ॐ</div>

  <div class="portrait-wrap">
    <div class="halo" aria-hidden="true"></div>
    <div class="halo-ring" aria-hidden="true"></div>
    <div class="frame"><img id="photo" src="" alt=""></div>
    <div class="offer-zone" id="offerZone" role="button" tabindex="0"
         aria-label="Offer flowers to the Guru"></div>
    <div class="pranam-row" id="pranamRow" aria-hidden="true"></div>
  </div>

  <div class="guru-block">
    <div class="guru-sa"    id="guruSa" data-edit="guru.nameSanskrit"></div>
    <div class="guru-latin" id="guruLatin" data-edit="guru.nameLatin"></div>
    <div class="guru-title" id="guruTitle" data-edit="guru.title"></div>
    <div class="rule" aria-hidden="true"><i></i></div>
    <div class="verse"    id="verse" data-edit="vandana.sanskrit"></div>
    <div class="verse-tr" id="verseTr" data-edit="vandana.transliteration"></div>
    <button class="more-link more-link-sm" id="guruMore" data-panel="swamiji">
      <span id="guruMoreLabel" data-edit="guru.moreLabel"></span><span class="arrow" aria-hidden="true">→</span>
    </button>
  </div>

  <div class="hero-actions">
    <div class="hint" id="hint" data-edit="labels.hint"></div>
    <div class="act-row">
      <button class="btn btn-obeisance" id="offerBtn" aria-label="Offer flowers to the Guru">
        <span id="offerIcon" aria-hidden="true"></span><span id="offerLabel" data-edit="labels.offerButton"></span>
      </button>
      <button class="btn btn-obeisance" id="pranamBtn" aria-label="Offer salutations to the Guru">
        <span id="pranamIcon" aria-hidden="true"></span><span id="pranamLabel" data-edit="labels.pranamButton"></span>
      </button>
    </div>
    <div class="act-row">
      <button class="btn btn-enter" id="enterBtn" aria-disabled="true">
        <span id="enterLabel" data-edit="labels.enterLocked"></span><span class="arrow" aria-hidden="true">→</span>
      </button>
    </div>
  </div>

  <a class="cue" id="cueBtn" href="#architect">
    <span id="cueLabel" data-edit="labels.sectionsCue"></span><span aria-hidden="true">⌄</span>
  </a>
</header>

<!-- One band per contributor, rendered from SITE_CONFIG.sections -->
<div id="sections"></div>

<footer class="site-foot">
  <div class="rule" style="margin:0 auto 16px;" aria-hidden="true"><i></i></div>
  <div id="mantras"></div>
</footer>

<div class="sheet-wrap" id="sheetWrap" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet" id="sheet"></div>
</div>

<script>
/* =========================================================================
   This page carries no words of its own.

   Everything it says is admin/content/home.json, and everything it does is
   admin/config/home.json — one file an editor changes, one an operator
   changes, neither of them this file. There is deliberately no fallback copy
   here: a second copy of the text is a second thing to keep in step, and it
   is always the stale one that ends up on screen.

   The cost of that is honest: if the content file cannot be read, the page
   says so and offers to retry rather than showing a half-built gate or, worse,
   letting people past a vandana it could not draw. tools/check_content.py
   fails the build if either file is missing a key this page needs, so a
   broken deploy is caught before it ships rather than by a visitor.
   ========================================================================= */
let SITE_CONFIG = null;

/* ========================================================================= */
(function () {
  'use strict';

  let cfg = null;
  const $ = (id) => document.getElementById(id);
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const esc = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const pick = (a) => a[Math.floor(Math.random() * a.length)];

  let offerings = 0;

  /* Line icons, drawn rather than borrowed from the emoji font. Colour emoji
     bring their own palette and fight the gold line-work; these inherit
     currentColor and match the hairline weight used everywhere else. */
  const ICONS = {
    quill:  '<path d="M4.6 20.4 3.6 16.9 15.4 5.1a1.9 1.9 0 0 1 2.7 0l1.4 1.4a1.9 1.9 0 0 1 0 2.7L7.9 21.2Z"/><path d="m14.3 6.2 4.1 4.1"/>',
    book:   '<path d="M3 6c3-1.6 6-1.6 9 0 3-1.6 6-1.6 9 0v12c-3-1.6-6-1.6-9 0-3-1.6-6-1.6-9 0Z"/><path d="M12 6v12"/>',
    people: '<circle cx="9.2" cy="8.8" r="3"/><circle cx="17" cy="10" r="2.2"/><path d="M3.2 19.6c0-3.4 2.7-5.6 6-5.6s6 2.2 6 5.6"/><path d="M17 15.2c2.3 0 3.8 1.7 3.8 4"/>',
    seated: '<circle cx="12" cy="6.4" r="2.7"/><path d="M6.6 19.4c0-4 2.4-7 5.4-7s5.4 3 5.4 7Z"/><path d="M4 19.4h16"/>',
    temple: '<path d="M3 9.2 12 4.2l9 5"/><path d="M5 9.6v8.6M9.4 9.6v8.6M14.6 9.6v8.6M19 9.6v8.6"/><path d="M3.4 18.6h17.2"/>',
    lotus:  '<path d="M12 20.2c-2.5-2.1-3.8-4.4-3.8-6.8 0-2.3 1.2-4.4 3.8-6.3 2.6 1.9 3.8 4 3.8 6.3 0 2.4-1.3 4.7-3.8 6.8Z"/><path d="M12 20.2c-4.2 0-7.3-1.8-9-5.1 2.7-1.6 5.6-1.3 8.2.9"/><path d="M12 20.2c4.2 0 7.3-1.8 9-5.1-2.7-1.6-5.6-1.3-8.2.9"/>',
    anjali: '<path d="M12 20.4c-2.9 0-4.9-2-4.9-4.7 0-3.1 2-6.8 4.9-10.1v14.8Z"/><path d="M12 20.4c2.9 0 4.9-2 4.9-4.7 0-3.1-2-6.8-4.9-10.1v14.8Z"/><path d="M7.4 13.2 4.6 15.5"/><path d="m16.6 13.2 2.8 2.3"/>',
    home:   '<path d="M3.4 10.8 12 4.1l8.6 6.7"/><path d="M5.8 10v9.8h12.4V10"/><path d="M9.9 19.8v-5.2h4.2v5.2"/>',
    lamp:   '<path d="M3.8 14.2h16.4c0 3.4-3.7 5.7-8.2 5.7s-8.2-2.3-8.2-5.7Z"/><path d="M12 13.8c-1.7-1.9-2.5-3.4-2.5-4.8 0-1.7 1-3 2.5-4.2 1.5 1.2 2.5 2.5 2.5 4.2 0 1.4-.8 2.9-2.5 4.8Z"/>',
    seed:   '<path d="M12 21c0-4.6 1.4-7.6 4.2-9 .4 4.8-.9 7.8-4.2 9Z"/><path d="M12 21c0-4.6-1.4-7.6-4.2-9-.4 4.8.9 7.8 4.2 9Z"/><path d="M12 21v-4"/><path d="M12 12.6c0-3.4.9-6 2.6-7.8"/>'
  };
  /* Śāṣṭāṅga namaskāra — the full prostration, eight limbs to the ground,
     arms reaching past the head with the palms joined. Its own function
     because it is a wide figure, not a 24x24 glyph like the rest. */
  function sashtanga(height) {
    const w = Math.round(height * (120 / 46));
    return '<svg viewBox="0 0 120 46" width="' + w + '" height="' + height + '" fill="none" ' +
           'stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" ' +
           'aria-hidden="true">' +
           '<path d="M6 36h108"/><path d="M14 32c4-1.6 7.6-1.2 10.8.6"/><path d="M24.8 32.6 40 33"/>' +
           '<circle cx="48" cy="29.5" r="5"/><path d="M53 31c7 1 13 1.6 20 1.6"/>' +
           '<path d="M53 27.4c8-2.4 15-2.6 22 1"/><path d="M75 33c8 0 14-1 20-3.4"/>' +
           '<path d="M95 29.6c5-1.8 9-2 14 .4"/><path d="M109 30v6"/></svg>';
  }

  function icon(name, size) {
    const d = ICONS[name];
    if (!d) return '';
    return '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size + '" fill="none" ' +
           'stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" ' +
           'aria-hidden="true">' + d + '</svg>';
  }

  /* A pārijāta blossom: five white petals around a saffron tube. Drawn rather
     than a single petal shape, because pārijāta falls whole. */
  function flowerSvg(size) {
    const petal = pick(cfg.flowers.petalColors);
    const heart = pick(cfg.flowers.heartColors);
    let g = '';
    for (let i = 0; i < 5; i++) {
      g += `<ellipse cx="12" cy="7" rx="3.3" ry="5.2" fill="${petal}"
             transform="rotate(${i * 72} 12 12)"/>`;
    }
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24">
      <g opacity=".97">${g}</g>
      <circle cx="12" cy="12" r="2.5" fill="${heart}"/>
      <circle cx="12" cy="12" r="1.1" fill="${petal}" opacity=".5"/>
    </svg>`;
  }

  /* ---------------------------------------------------------- render ---- */
  function render() {
    $('brandLatin').textContent   = cfg.brand.latin;
    $('brandTagline').textContent = cfg.brand.tagline;
    // Only offer the toggle if the clamp is actually hiding something.
    requestAnimationFrame(function () {
      const t = $('brandTagline'), btn = $('taglineMore');
      if (t.scrollHeight <= t.clientHeight + 2) return;
      btn.hidden = false;
      btn.textContent = t.classList.contains('open') ? cfg.labels.readLess : cfg.labels.readMore;
      // render() runs a second time when admin/config/landing.json lands, so
      // the listener is attached once and reads cfg fresh on every click.
      if (btn.dataset.bound) return;
      btn.dataset.bound = '1';
      btn.addEventListener('click', function () {
        const open = t.classList.toggle('open');
        btn.textContent = open ? cfg.labels.readLess : cfg.labels.readMore;
      });
    });

    const photo = $('photo');
    photo.src = cfg.photo.src;
    photo.alt = cfg.photo.alt || '';
    photo.style.objectPosition = cfg.photo.objectPosition || 'center 50%';
    document.querySelector('.frame').style.setProperty('--frame-ratio', cfg.photo.frameRatio || '2 / 3');
    const zone = $('offerZone');
    zone.style.setProperty('--offer-x', cfg.photo.offerX || '50%');
    zone.style.setProperty('--offer-y', cfg.photo.offerY || '14%');
    zone.style.setProperty('--offer-w', cfg.photo.offerW || '54%');
    zone.style.setProperty('--offer-h', cfg.photo.offerH || '62px');

    $('guruSa').textContent        = cfg.guru.nameSanskrit;
    $('guruLatin').textContent     = cfg.guru.nameLatin;
    $('guruTitle').textContent     = cfg.guru.title;
    $('guruMoreLabel').textContent = cfg.guru.moreLabel;
    $('verse').innerHTML           = cfg.vandana.sanskrit;
    $('verseTr').textContent       = cfg.vandana.transliteration;

    $('hint').textContent        = cfg.labels.hint;
    $('offerIcon').innerHTML     = flowerSvg(15);
    $('offerLabel').textContent  = cfg.labels.offerButton;
    $('pranamIcon').innerHTML     = sashtanga(15);
    $('pranamLabel').textContent  = cfg.labels.pranamButton;
    $('enterLabel').textContent  = cfg.labels.enterLocked;
    $('cueLabel').textContent    = cfg.labels.sectionsCue;

    $('mantras').innerHTML = cfg.footer.lines.map(function (l, i) {
      return `<div class="mantra${i ? ' second' : ''}" data-edit="footer.lines.${i}.sa">${esc(l.sa)}</div>` +
             (l.latin ? `<div class="mantra-latin" data-edit="footer.lines.${i}.latin">${esc(l.latin)}</div>` : '');
    }).join('');

    // Mandala spokes, drawn rather than written into the markup. Cleared
    // first so a second render() does not stack a duplicate path on top.
    $('spokes').innerHTML = '';
    let d = '';
    for (let i = 0; i < 24; i++) {
      const a = (i / 24) * Math.PI * 2;
      d += `M${200 + Math.cos(a) * 60} ${200 + Math.sin(a) * 60}L${200 + Math.cos(a) * 168} ${200 + Math.sin(a) * 168}`;
    }
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', d);
    $('spokes').appendChild(path);

    renderSections();
    if (!cfg.requireOffering) unlock();
  }

  function renderSections() {
    // The index is part of the path, so an edit lands on the right band even
    // after one is reordered or removed in the JSON.
    $('sections').innerHTML = cfg.sections.map(function (sec, si) {
      const at = (k) => ' data-edit="sections.' + si + '.' + k + '"';
      const meta = (sec.meta || []).map(m => esc(m)).join('<br>');

      let html = `<section class="band person" id="${esc(sec.id)}"><div class="inner">
        <div class="person-head">
          <div class="person-icon" aria-hidden="true">${icon(sec.icon, 28)}</div>
          <div>
            <div class="person-eyebrow"${at('eyebrow')}>${esc(sec.eyebrow)}</div>
            <div class="person-name"${at('name')}>${esc(sec.name)}${sec.sub ? ` <span${at('sub')}>${esc(sec.sub)}</span>` : ''}</div>
            ${meta ? `<div class="person-meta">${meta}</div>` : ''}
          </div>
        </div>
        ${[].concat(sec.blurb).map((t, bi) => `<p class="person-blurb" data-edit="sections.${si}.blurb${Array.isArray(sec.blurb) ? '.' + bi : ''}">${esc(t)}</p>`).join('')}`;

      if (sec.items) {
        html += '<ul class="person-items">' + sec.items.map(function (i, ii) {
          const ip = 'sections.' + si + '.items.' + ii + '.';
          return `<li><span data-edit="${ip}name">${esc(i.name)}</span>` +
                 `${i.note ? `<small data-edit="${ip}note">${esc(i.note)}</small>` : ''}</li>`;
        }).join('') + '</ul>';
      }

      if (sec.panel) {
        html += `<div class="person-actions">
          <button class="more-link" data-panel="${esc(sec.panel)}">
            ${esc(sec.moreLabel || 'Know More')} <span class="arrow" aria-hidden="true">→</span>
          </button></div>`;
      }

      if (sec.todo) html += `<p class="person-todo"${at('todo')}>${esc(sec.todo)}</p>`;
      return html + '</div></section>';
    }).join('');
  }

  /* ----------------------------------------------------------- panels --- */
  function panelHtml(key) {
    const p = cfg.panels[key];
    if (!p) return '';
    const pt = (k) => ' data-edit="panels.' + key + '.' + k + '"';

    let html = `<button class="sheet-close" data-close aria-label="Close">✕</button>
      <div class="sheet-eyebrow"${pt('eyebrow')}>${esc(p.eyebrow)}</div>
      <h3 id="sheetTitle"${pt('title')}>${esc(p.title)}</h3>`;

    if (p.reverence) html += `<div class="reverence"${pt('reverence')}>${esc(p.reverence)}</div>`;
    if (p.body)      html += `<p${pt('body')}>${esc(p.body)}</p>`;

    (p.groups || []).forEach(function (g, gi) {
      const gp = 'panels.' + key + '.groups.' + gi + '.';
      html += `<div class="ack">
        <div class="ack-head">
          <span class="ico">${icon(g.icon, 22)}</span>
          <h4 data-edit="${gp}heading">${esc(g.heading)}</h4>
          <span class="line" aria-hidden="true"></span>
        </div>`;

      if (g.entries) {
        html += '<ul class="ack-entries">' + g.entries.map(function (e, ei) {
          const ep = gp + 'entries.' + ei + '.';
          return `<li><b data-edit="${ep}name">${esc(e.name)}</b><div class="ack-body">` +
                 (e.note ? `<small data-edit="${ep}note">${esc(e.note)}</small>` : '') +
                 (e.also ? `<small class="also" data-edit="${ep}also">${esc(e.also)}</small>` : '') +
                 '</div></li>';
        }).join('') + '</ul>';
      }
      if (g.names) {
        html += '<div class="ack-names">' + g.names.map(n => `<span>${esc(n)}</span>`).join('') + '</div>';
      }
      html += '</div>';
    });

    return html;
  }

  /* These notes vary from four words to a paragraph, which left the cards
     at wildly different heights. Each is clamped to a few lines and given a
     "Read more" — but only where there is genuinely something hidden, so a
     one-line note never grows a pointless control. Measured after the panel
     is on screen, since a collapsed element has no height to measure. */
  function applyReadMore(root) {
    root.querySelectorAll('.ack-body').forEach(function (body) {
      if (body.scrollHeight <= body.clientHeight + 2) return;
      const btn = document.createElement('button');
      btn.className = 'ack-more';
      btn.type = 'button';
      btn.textContent = cfg.labels.readMore;
      btn.addEventListener('click', function () {
        const open = body.classList.toggle('open');
        btn.textContent = open ? cfg.labels.readLess : cfg.labels.readMore;
      });
      body.after(btn);
    });
  }

  function panelTail(p, html) {
    if (p.closing) {
      html += `<div class="closing">
        <span class="ico" aria-hidden="true">${icon('lotus', 26)}</span>
        <p${pt('closing')}>${esc(p.closing)}</p>
      </div>`;
    }
    if (p.todo) html += `<p class="sheet-todo">${esc(p.todo)}</p>`;
    return html;
  }

  let lastFocus = null;
  function openPanel(key) {
    const html = panelTail(cfg.panels[key], panelHtml(key));
    if (!html) return;
    lastFocus = document.activeElement;
    $('sheet').setAttribute('data-panel-key', key);
    $('sheet').innerHTML = html;
    $('sheet').scrollTop = 0;
    $('sheetWrap').classList.add('open');
    document.body.classList.add('modal-open');
    applyReadMore($('sheet'));
    const close = $('sheet').querySelector('[data-close]');
    if (close) close.focus({ preventScroll: true });
  }
  function closePanel() {
    $('sheetWrap').classList.remove('open');
    document.body.classList.remove('modal-open');
    if (lastFocus) lastFocus.focus({ preventScroll: true });
  }

  /* ---------------------------------------------------------- flowers --- */
  // Coordinates stay relative to the hero, not the viewport, so a settled
  // heap stays on his feet once the page is scrolled.
  function heroPoint(clientX, clientY) {
    const h = $('hero').getBoundingClientRect();
    return { x: clientX - h.left, y: clientY - h.top };
  }

  function offer() {
    const r = $('offerZone').getBoundingClientRect();
    const f = document.querySelector('.frame').getBoundingClientRect();
    const target = heroPoint(r.left + r.width / 2, r.top + r.height / 2);
    // Always from above the arch, whatever released them.
    const origin = heroPoint(f.left + f.width / 2, f.top - 40);

    offerings++;
    ripple();

    if (!reduced) {
      const n = cfg.flowers.countPerOffering;
      for (let i = 0; i < n; i++) rainFlower(origin, target, i, n, r.width);
    }
    if (cfg.requireOffering && offerings >= cfg.minOfferings) unlock();
  }

  function pranam() {
    offerings++;
    ripple();
    if (!reduced) {
      const n = cfg.pranam.count;
      const row = $('pranamRow');
      const arch = document.querySelector('.frame').getBoundingClientRect().width;
      const base = Math.max(13, Math.min(22, Math.round(arch / 11)));
      for (let i = 0; i < n; i++) {
        const g = document.createElement('div');
        g.className = 'pranam-mark';
        g.innerHTML = sashtanga(base + (i === 1 ? 2 : 0));
        g.style.animationDelay = (i * 140) + 'ms';
        row.appendChild(g);
        setTimeout(() => g.remove(), 3200 + i * 140);
      }
    }
    if (cfg.requireOffering && offerings >= cfg.minOfferings) unlock();
  }

  function rainFlower(origin, target, i, n, padaW) {
    const size = 11 + Math.random() * 10;

    const outer = document.createElement('div');
    outer.className = 'petal';
    const inner = document.createElement('div');
    inner.innerHTML = flowerSvg(size);
    outer.appendChild(inner);

    // Fan out, so a burst reads as a handful released together rather than a
    // vertical column.
    const spread = (i / n - 0.5) * 120;
    const sx = origin.x + spread + (Math.random() - 0.5) * 40;
    const sy = origin.y - 20 - Math.random() * 70;
    const ex = target.x + (Math.random() - 0.5) * Math.max(80, padaW * 0.8);
    const ey = target.y + (Math.random() - 0.5) * 16;

    outer.style.left = sx + 'px';
    outer.style.top  = sy + 'px';
    $('petals').appendChild(outer);

    const dur = 1500 + Math.random() * 1400;
    const delay = i * 44 + Math.random() * 170;

    outer.animate([
      { transform: 'translate(0,0)', opacity: 0 },
      { transform: `translate(${(ex - sx) * .45}px, ${(ey - sy) * .40}px)`, opacity: 1, offset: .30 },
      { transform: `translate(${(ex - sx) * .82}px, ${(ey - sy) * .80}px)`, opacity: 1, offset: .75 },
      { transform: `translate(${ex - sx}px, ${ey - sy}px)`, opacity: .95 }
    ], { duration: dur, delay, easing: 'cubic-bezier(.35,.05,.5,1)', fill: 'forwards' });

    inner.animate([
      { transform: 'translateX(0) rotate(0deg)' },
      { transform: `translateX(${(Math.random() > .5 ? 1 : -1) * (14 + Math.random() * 20)}px) rotate(${100 + Math.random() * 140}deg)` },
      { transform: `translateX(0) rotate(${220 + Math.random() * 220}deg)` }
    ], { duration: dur, delay, easing: 'ease-in-out', fill: 'forwards' });

    setTimeout(function () {
      outer.remove();
      settle(ex, ey, size);
    }, dur + delay);
  }

  function settle(x, y, size) {
    const s = document.createElement('div');
    s.className = 'settled';
    s.style.left = x + 'px';
    s.style.top  = y + 'px';
    s.innerHTML  = flowerSvg(size * .9);
    s.firstChild.style.transform = `rotate(${Math.random() * 360}deg)`;
    $('petals').appendChild(s);
    const all = $('petals').querySelectorAll('.settled');
    if (all.length > cfg.flowers.maxSettled) all[0].remove();
  }

  function ripple() {
    if (reduced) return;
    const r = document.createElement('div');
    r.className = 'ripple';
    $('offerZone').appendChild(r);
    setTimeout(() => r.remove(), 1600);
  }

  /* ------------------------------------------------------------ gate ---- */
  function unlock() {
    const btn = $('enterBtn');
    if (btn.classList.contains('ready')) return;
    btn.classList.add('ready');
    btn.setAttribute('aria-disabled', 'false');
    $('enterLabel').textContent = cfg.labels.enterReady;
  }

  function destination() {
    const fallback = cfg.enterUrl || '';
    let next;
    try { next = new URLSearchParams(location.search).get('next'); } catch (e) { return fallback; }
    if (!next) return fallback;
    let url;
    try { url = new URL(next, location.href); } catch (e) { return fallback; }
    // Same-origin only. An absolute URL elsewhere, or //elsewhere, is someone
    // trying to use this page as an open redirect.
    if (url.origin !== location.origin) return fallback;
    if (url.pathname === location.pathname) return fallback;
    return url.pathname + url.search + url.hash;
  }

  function markPassed() {
    try { sessionStorage.setItem(cfg.passKey, String(Date.now())); } catch (e) {}
  }

  function enter() {
    if (cfg.requireOffering && offerings < cfg.minOfferings) return;
    markPassed();
    document.body.classList.add('leaving');
    const target = destination();
    if (target) setTimeout(function () { window.location.href = target; }, 620);
  }

  /* ------------------------------------------------------------ bind ---- */
  function bind() {
    $('offerBtn').addEventListener('click', offer);
    $('pranamBtn').addEventListener('click', pranam);
    $('offerZone').addEventListener('click', offer);
    $('offerZone').addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); offer(); }
    });
    $('enterBtn').addEventListener('click', enter);

    document.addEventListener('click', function (ev) {
      const opener = ev.target.closest('[data-panel]');
      if (opener) openPanel(opener.getAttribute('data-panel'));
    });

    $('sheetWrap').addEventListener('click', function (ev) {
      if (ev.target === $('sheetWrap') || ev.target.closest('[data-close]')) closePanel();
    });
    document.addEventListener('keydown', function (ev) {
      if (ev.key !== 'Escape') return;
      if ($('sheetWrap').classList.contains('open')) closePanel();
    });
  }

  /* --------------------------------------------------------- boot ------- */
  /* The words and the mechanics arrive as two files, and the page draws only
     once both are in hand. Nothing is rendered from a placeholder first: a
     flash of English defaults under a Sanskrit masthead is worse than a
     moment of nothing, and there are no defaults here to flash. */
  function fail(reason) {
    const hero = $('hero');
    if (!hero) return;
    hero.innerHTML =
      '<div class="boot-fail">' +
      '<div class="boot-om" aria-hidden="true">ॐ</div>' +
      '<p>The page could not load its text.</p>' +
      '<p class="boot-why">' + esc(reason) + '</p>' +
      '<button class="btn btn-enter" onclick="location.reload()">' +
      '<span>Try again</span></button></div>';
    console.error('[Landing]', reason);
  }

  function get(rel) {
    return fetch(rel + '?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error(rel + ' returned ' + r.status);
        return r.json();
      });
  }

  Promise.all([get('admin/content/home.json'), get('admin/config/home.json')])
    .then(function (both) {
      const content = both[0], conf = both[1];
      // The _readme keys are for whoever edits the files; they are not page data.
      delete content._readme; delete conf._readme;
      cfg = Object.assign({}, conf, content);
      SITE_CONFIG = cfg;
      window.SITE_CONFIG = cfg;

      // Named so a missing one is reported as itself rather than as a
      // TypeError halfway through render().
      const need = ['brand', 'guru', 'vandana', 'labels', 'sections', 'panels', 'footer',
                    'enterUrl', 'photo', 'flowers', 'pranam'];
      const absent = need.filter(function (k) { return cfg[k] == null; });
      if (absent.length) throw new Error('missing: ' + absent.join(', '));

      render();
      bind();
    })
    .catch(function (e) { fail(e && e.message ? e.message : String(e)); });

  /* content-inline.js stages an edit into SITE_CONFIG and calls this, so the
     change appears in the real layout rather than in a preview pane. */
  window.dgeContentRerender = function () {
    if (!cfg) return;
    render();
    if ($('sheetWrap').classList.contains('open')) {
      const open = $('sheet').getAttribute('data-panel-key');
      if (open) openPanel(open);
    }
  };

  window.dgeVandana = { openPanel, closePanel, enter, get offerings() { return offerings; } };
})();
</script>
<script src="dge/js/content-inline.js?v=1"></script>
</body>
