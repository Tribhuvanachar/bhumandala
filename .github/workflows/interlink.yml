name: DGE deep-interlink (auto, on library changes)

# Whenever grantha content lands in dge/data/ -- a new text imported, an
# existing one edited -- the cross-reference layers that point INTO and OUT
# of that content go stale. This workflow rebuilds the small, in-repo ones
# automatically and commits the result, so interlinking keeps itself
# current without anyone remembering to run anything:
#
#   dge/data/.../ashtadhyayi/prayoga_index/**   (build_sutra_prayoga_index.py)
#       where each Panini sutra is quoted or cited across the corpus,
#       Madhva-lineage works ranked first -- the sutra page's
#       साहित्ये प्रयोगाः panel
#   dge/search_index/backlinks/**               (shard_backlinks.py)
#       verse -> "who comments on this" pointers
#   admin/config/library-status.json            (gen_library_status.py)
#       the Library Manager's per-section status snapshot
#
# The big corpus-search index is NOT rebuilt here: it is 330 MB, lives on
# the search-dist branch behind a CDN pin that needs a manual bump, and
# has its own manual workflow (reindex.yml). This job's summary says when
# that run looks warranted.
#
# Loop guard, twice over: the trigger paths exclude this workflow's own
# outputs, and the job skips itself when the pushing actor is the bot.

on:
  push:
    branches: [main]
    paths:
      - "dge/data/**"
      - "!dge/data/vedanga/vyakarana/ashtadhyayi/prayoga_index/**"
      - "!dge/data/vedanga/vyakarana/ashtadhyayi/_index/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dge-interlink
  cancel-in-progress: true

jobs:
  interlink:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyahocorasick

      - name: Rebuild sutra-prayoga index (lineage-first corpus citations)
        run: python tools/build_sutra_prayoga_index.py

      - name: Rebuild backlink shards (verse -> commentaries)
        run: python tools/shard_backlinks.py

      - name: Refresh library status snapshot
        run: python tools/gen_library_status.py

      - name: Commit whatever actually changed
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          git add dge/data/vedanga/vyakarana/ashtadhyayi/prayoga_index \
                  dge/search_index/backlinks \
                  admin/config/library-status.json
          if git diff --cached --quiet; then
            echo "interlink layers already current -- nothing to commit"
          else
            git commit -m "Interlink rebuild: prayoga index, backlinks, library status

Automatic (interlink.yml) after library content changed in $GITHUB_SHA."
            # someone may have pushed while we built; rebase, ours are
            # generated files nobody else edits between runs
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Note whether a full search reindex looks warranted
        run: |
          {
            echo "Interlink layers rebuilt for \`$GITHUB_SHA\`."
            echo ""
            echo "The 330 MB corpus-search index on search-dist is NOT rebuilt"
            echo "automatically -- if this push added or reworded verses, run the"
            echo "manual **DGE re-index** workflow (reindex.yml) and bump the CDN pin"
            echo "it prints, so global search sees the new content too."
          } >> "$GITHUB_STEP_SUMMARY"
