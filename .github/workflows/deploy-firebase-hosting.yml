# Deploy the static site to Firebase Hosting (project from the FIREBASE_PROJECT_ID secret).
#
# Context: dge/GO_LIVE_ARCHITECTURE.md §3 and the lead's "GitHub Pages → Firebase Migration Guide"
# (6 Sep 2026). GitHub Pages stays the live origin until the DNS cutover in that guide's Part 3; this
# workflow publishes the same commit to https://<project>.web.app so it can be checked first.
#
# Secrets used (Settings → Secrets and variables → Actions):
#   FIREBASE_PROJECT_ID        e.g. sarvamula-org                       (added by the lead 6 Sep 2026)
#   FIREBASE_SERVICE_ACCOUNT   JSON key of a service account with the "Firebase Hosting Admin" role:
#                              Firebase console → Project settings → Service accounts → Generate new
#                              private key. Still to be added — the workflow fails fast without it.
# FIREBASE_API_KEY / FIREBASE_AUTH_DOMAIN are not needed here: the web config is public and lives in
# dge/js/config.js (FIREBASE_SETUP.md §4).
name: Deploy — Firebase Hosting

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Hosting channel: 'live' publishes to <project>.web.app; any other name makes a temporary preview URL"
        required: true
        default: "preview"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        env:
          PID: ${{ secrets.FIREBASE_PROJECT_ID }}
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test -n "$PID" || { echo "FIREBASE_PROJECT_ID secret is not set"; exit 1; }
          test -n "$SA"  || { echo "FIREBASE_SERVICE_ACCOUNT secret is not set (Firebase console → Project settings → Service accounts → Generate new private key)"; exit 1; }
      - name: Write .firebaserc (gitignored on purpose — the repo never carries a project id)
        run: |
          printf '{ "projects": { "default": "%s" } }\n' "${{ secrets.FIREBASE_PROJECT_ID }}" > dge/firebase/.firebaserc
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: ${{ inputs.channel }}
          entryPoint: dge/firebase
