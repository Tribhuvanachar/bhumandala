name: DGE ingest

on:
  workflow_dispatch:
    inputs:
      text:
        description: "Which text to (re)generate"
        required: true
        default: bhagavata
        type: choice
        options:
          - bhagavata
          - ramayana
          - mahabharata
          - harivamsha
          - manu_smriti
          - yajnavalkya_smriti
          - parashara_smriti
          - narada_smriti
          - vishnu_smriti
          - raghuvamsha
          - shishupalavadha
          - kumarasambhava
          - kiratarjuniya

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r importers/requirements.txt
      - name: Run importer (${{ inputs.text }})
        env:
          TEXT_ID: ${{ inputs.text }}
        run: python importers/dispatch.py "$TEXT_ID"
      - name: Refresh library status snapshot
        run: python tools/gen_library_status.py
      - name: Open Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ingest/${{ inputs.text }}
          commit-message: "data: ingest ${{ inputs.text }}"
          title: "Ingest: ${{ inputs.text }}"
          body: |
            Automated ingest of **${{ inputs.text }}** via GitHub Actions.
            Parser: `importers/`. Spot-check Devanagari fidelity before merging.
          add-paths: |
            dge/data/**
