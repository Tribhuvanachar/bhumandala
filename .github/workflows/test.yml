name: Tests

# The project's only general-purpose CI gate. Every other workflow here is
# workflow_dispatch (a specific ingestion/import pipeline someone runs by
# hand) or a narrow auto-trigger scoped to its own output paths -- none of
# them run the actual test suites on an ordinary push. This one does:
# the Python suite (tests/), the standalone offline import tests under
# tools/, the plain-Node JS tests (no framework, no build step -- this
# project's own convention), tools/validate_data.py's structural corpus
# check, tools/validate_gold_standard.py's V1-V7 gate over any
# format:gold_v2_2 commentary already in dge/data/, and the generated-file
# drift gates (frontend shell, sitemap.xml/robots.txt) that fail if their
# source changed without regenerating the committed output.
#
# tools/darshanas/test_darshanas.py is deliberately NOT run here: it syncs
# and writes taxonomy.json/library.json as a side effect (a migration
# script, not a repeatable test), which a CI gate must never do.

on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # build_sitemap.py's --check gate below derives each URL's
          # lastmod from real git history; a shallow (depth-1) checkout
          # has no history to derive it from -- its one boundary commit
          # looks like it "added" every file, which would make every
          # lastmod collapse to today's date and never match sitemap.xml
          # as committed.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install pytest beautifulsoup4 requests pyyaml

      - name: Python test suite (tests/)
        run: python3 -m pytest tests/ -q

      - name: Dvaita Vedanta parser tests
        run: python3 tools/dvaitavedanta/test_dv_parse.py

      - name: Dvaita Vedanta offline import tests
        run: python3 tools/dvaitavedanta/test_import_offline.py

      - name: Sayana/Smriti/wikisource parser tests
        run: python3 -m pytest tools/sayana_smriti/tests/ -q

      - name: set_site_url tests
        run: python3 tools/test_set_site_url.py

      - name: build_sitemap tests
        run: python3 tools/test_build_sitemap.py

      - name: JS -- search resilience
        run: node dge/js/test-search-resilience.js

      - name: JS -- JS/Python normalizer parity
        run: node dge/js/test-parity.js

      - name: JS -- Gold-Standard renderer
        run: node dge/js/test-gold-render.js

      - name: JS -- audio detection
        run: node tools/audio_admin/test-audio-detect.js

      - name: Corpus structural check (validate_data.py)
        run: python3 tools/validate_data.py

      - name: Gold-Standard contract gate (validate_gold_standard.py)
        run: python3 tools/validate_gold_standard.py --scan-corpus --data dge/data

      - name: Frontend redesign -- shared-chrome regression guard
        run: python3 tools/redesign/audit_pages.py --check

      - name: Frontend redesign -- baked shell drift gate (build_shell.py)
        run: python3 tools/redesign/build_shell.py --check

      - name: sitemap.xml / robots.txt drift gate (build_sitemap.py)
        run: python3 tools/build_sitemap.py --check
