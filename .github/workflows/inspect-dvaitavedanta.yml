name: Inspect DvaitaVedanta

# A read-only structural probe. Fetches a handful of pages and prints their
# SHAPE — article blocks, AJAX hooks, the commentary switcher, link weight —
# into the job log. Writes nothing, opens no PR, touches no data.
#
# It exists because the two channels that would normally carry this back are
# both closed: the Cowork sandbox has no egress to dvaitavedanta.in, and it
# cannot download run artifacts either. The job log is the only way through.
#
# Used to work out how the later_acharyas granthas (Nyayasudha, Nyayamruta,
# Tarkatandava …) serve their commentaries, since on those the first response
# carries the mula alone and the commentaries arrive on click.

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Space-separated page URLs to report the structure of"
        type: string
        default: "https://dvaitavedanta.in/category-details/13901/4778/sharav/nayaya/parath/managa"
      links:
        description: "Space-separated URLs to list every content link of (for re-pointing a seed)"
        type: string
        default: ""
      load_data:
        description: "Space-separated book_id:sutra_id pairs to call /load-data with"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: inspect-dvaitavedanta
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r tools/dvaitavedanta/requirements.txt

      - name: Inspect
        env:
          URLS: ${{ inputs.urls }}
          LINKS: ${{ inputs.links }}
          LOAD_DATA: ${{ inputs.load_data }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "$URLS" ]; then ARGS+=(--url $URLS); fi
          if [ -n "$LINKS" ]; then ARGS+=(--links $LINKS); fi
          if [ -n "$LOAD_DATA" ]; then ARGS+=(--load-data $LOAD_DATA); fi
          python tools/dvaitavedanta/dv_inspect.py "${ARGS[@]}"
