name: DGE OCR Sanskrit/Kannada commentary (server-side)

# Runs tools/gemini_ocr_commentary.py: PDF pages -> Vision OCR -> Gemini
# proofreading -> merged into one kavya canto's data.json. Exists because
# dge/convert/ (the browser admin tool) has no server-side equivalent --
# a real scanned book times out a browser tab, and that tool has no way to
# skip its manual review step. This workflow has no wall-clock UI timeout
# (GitHub Actions' own job limit is 6 hours), and direct_push below is the
# real bypass for the slow part -- Gemini's own proofreading pass still
# runs (it's the correction step, not optional), but its "accept" /
# "review" / "unresolved" self-classification is what gates what merges
# automatically; see the script's own docstring for the full design.
#
# The PDF itself is never committed to the repo (repo size budget --
# PROJECT_BRIEF.md rule 5): give a direct-download URL and the workflow
# fetches it into a throwaway runner temp dir.
#
# Requires GEMINI_API_KEY (already used by the other Gemini workflows) and
# a VISION_API_KEY repository secret (Google Cloud Vision API key -- same
# key dge/convert/'s browser tool takes from the admin, just stored as a
# repo secret here instead of localStorage). Same deliberate, scoped
# exception to this project's BYOK-only convention as the other
# server-side Gemini pipelines -- see gemini-enrich.yml's header comment.

on:
  workflow_dispatch:
    inputs:
      pdf_url:
        description: "Direct-download URL for the source PDF (never committed to the repo)"
        required: true
      start_page:
        description: "First PDF page to OCR (1-indexed, inclusive)"
        required: true
      end_page:
        description: "Last PDF page to OCR (1-indexed, inclusive)"
        required: true
      sarga_dir:
        description: "Directory of sarga_N/data.json subfolders"
        required: true
        default: dge/data/kavya_alankara/raghavendra_vijaya
      canto:
        description: "Which canto (sarga) these pages belong to -- run once per canto"
        required: true
      commentary_key:
        description: "Key under shlokas[n].commentaries to write into (e.g. tika_someauthor)"
        required: true
      display_label:
        description: "Human-readable label for metadata.availableCommentaries"
        required: true
      context_anchor:
        description: 'e.g. "Raghavendra Vijaya, Sanskrit tika by X, Sarga 1" -- helps Gemini resolve ambiguous OCR'
        required: false
        default: ""
      content_field:
        description: "Which proofread field is this commentary's text -- 'commentary' for a tika/bhashya PDF (mula already in the corpus), 'sa' only if this PDF IS a mula-text source"
        required: true
        default: commentary
        type: choice
        options:
          - commentary
          - sa
      include_review:
        description: "Also merge shlokas Gemini flagged 'review' (a judgment call was made)"
        required: true
        default: false
        type: boolean
      include_unresolved:
        description: "Also merge shlokas Gemini flagged 'unresolved' (low confidence) -- use with caution"
        required: true
        default: false
        type: boolean
      model:
        description: "Gemini model to use"
        required: true
        default: gemini-flash-latest
        type: choice
        options:
          - gemini-flash-latest
          - gemini-flash-lite-latest
      direct_push:
        description: "Skip the review PR and push straight to main"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  ocr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Download PDF
        run: |
          set -euo pipefail
          curl -fL "${{ inputs.pdf_url }}" -o /tmp/commentary.pdf
          echo "Downloaded: $(du -h /tmp/commentary.pdf | cut -f1)"
      - name: Run OCR + proofread + merge (canto ${{ inputs.canto }}, pages ${{ inputs.start_page }}-${{ inputs.end_page }})
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VISION_API_KEY: ${{ secrets.VISION_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ] || [ -z "$VISION_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY and/or VISION_API_KEY repository secret is not set. Add them under" \
                 "Settings -> Secrets and variables -> Actions before running this workflow."
            exit 1
          fi
          ARGS=(--pdf /tmp/commentary.pdf --start-page "${{ inputs.start_page }}" --end-page "${{ inputs.end_page }}"
                --sarga-dir "${{ inputs.sarga_dir }}" --canto "${{ inputs.canto }}"
                --commentary-key "${{ inputs.commentary_key }}" --display-label "${{ inputs.display_label }}"
                --content-field "${{ inputs.content_field }}" --model "${{ inputs.model }}")
          if [ -n "${{ inputs.context_anchor }}" ]; then ARGS+=(--context-anchor "${{ inputs.context_anchor }}"); fi
          if [ "${{ inputs.include_review }}" = "true" ]; then ARGS+=(--include-review); fi
          if [ "${{ inputs.include_unresolved }}" = "true" ]; then ARGS+=(--include-unresolved); fi
          python3 tools/gemini_ocr_commentary.py "${ARGS[@]}"
      - name: Validate corpus data
        run: python3 tools/validate_data.py
      - name: Show what changed
        run: git status --porcelain "${{ inputs.sarga_dir }}"

      - name: Push directly to main
        if: ${{ fromJSON(inputs.direct_push) }}
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          if git diff --quiet -- "${{ inputs.sarga_dir }}"; then
            echo "No changes to push."
            exit 0
          fi
          git add "${{ inputs.sarga_dir }}"
          git commit -m "data: OCR commentary '${{ inputs.commentary_key }}' for ${{ inputs.sarga_dir }} canto ${{ inputs.canto }} [direct-push]"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:main

      - name: Open a review PR
        if: ${{ !fromJSON(inputs.direct_push) }}
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ocr-commentary/${{ github.run_id }}
          commit-message: "data: OCR commentary '${{ inputs.commentary_key }}' for ${{ inputs.sarga_dir }} canto ${{ inputs.canto }}"
          title: "OCR commentary: ${{ inputs.commentary_key }} — ${{ inputs.sarga_dir }} canto ${{ inputs.canto }}"
          body: |
            Automated OCR + Gemini proofreading via `tools/gemini_ocr_commentary.py`
            (model: `${{ inputs.model }}`, pages ${{ inputs.start_page }}-${{ inputs.end_page }},
            content_field: `${{ inputs.content_field }}`).

            Only shlokas Gemini self-classified "accept" were merged automatically
            (include_review=`${{ inputs.include_review }}`, include_unresolved=`${{ inputs.include_unresolved }}`).
            Check the job log for how many verses were held back and why.

            Landed under `commentaries.${{ inputs.commentary_key }}`, labeled
            "${{ inputs.display_label }}" in `metadata.availableCommentaries`.
            This is a real author's text, OCR-digitized and Gemini-proofread —
            same category as `pavamanacharya_english`, so it does NOT get the
            reader's "AI" badge (that's reserved for content an AI generated
            itself, e.g. `gemini_padaccheda`/`gemini_summary` — see
            PROJECT_BRIEF.md's AI-marking convention and `dgeIsAiGeneratedCommentaryKey`
            in `core.js`). Spot-check a sample before trusting it as
            author-faithful, same as any OCR pass.
          add-paths: |
            ${{ inputs.sarga_dir }}/**
