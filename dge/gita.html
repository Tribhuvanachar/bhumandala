<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhagavad Gita - Chapter 1</title>
    <style>
        /* Base Styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        #gita-container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Typography */
        h1 {
            text-align: center;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }

        /* Loading & Error States */
        #status-message {
            text-align: center;
            font-size: 1.2em;
            color: #7f8c8d;
            margin-top: 50px;
        }

        .error-text {
            color: #e74c3c !important;
        }

        /* Card Layout for Verses */
        .verse-card {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            padding: 25px;
            margin-bottom: 30px;
            border-left: 5px solid #e67e22;
        }

        .verse-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .verse-number {
            font-size: 1.2em;
            font-weight: bold;
            color: #d35400;
        }

        .shloka {
            font-size: 1.3em;
            color: #2980b9;
            font-weight: 500;
            margin-bottom: 20px;
            white-space: pre-wrap;
        }

        /* Commentaries Section */
        .commentary-block {
            margin-bottom: 15px;
            background: #fdfefe;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #e5e8e8;
        }

        .commentary-label {
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7f8c8d;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .commentary-text {
            color: #444;
            font-size: 1em;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <div id="gita-container">
        <div id="status-message">Loading sacred texts...</div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById('gita-container');
            const statusMessage = document.getElementById('status-message');

            // Fetch the JSON file from the same directory
            fetch('gita.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! Status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    // Clear the loading message
                    container.innerHTML = '';
                    renderGita(data, container);
                })
                .catch(error => {
                    console.error("Error fetching the JSON:", error);
                    statusMessage.innerHTML = `<span class="error-text">Failed to load the texts. Please ensure <strong>gita.json</strong> is uploaded to the same directory on GitHub.</span>`;
                });
        });

        // Function to render the JSON data into HTML
        function renderGita(gitaData, container) {
            // Add the Chapter Title
            const header = document.createElement('h1');
            header.textContent = `Chapter ${gitaData.chapter}: ${gitaData.title.replace(/\/g, '')}`; 
            container.appendChild(header);

            // Loop through each verse and create a card
            gitaData.verses.forEach(verse => {
                const card = document.createElement('div');
                card.className = 'verse-card';

                // Helper to clean up citation brackets if you want a cleaner UI
                const cleanText = (text) => text ? text.replace(/\/g, '') : "Not provided";

                // Construct the HTML for the card
                card.innerHTML = `
                    <div class="verse-header">
                        <span class="verse-number">Verse ${verse.verse_numbers}</span>
                    </div>
                    <div class="shloka">${cleanText(verse.shloka)}</div>
                    
                    <div class="commentary-block">
                        <div class="commentary-label">Gita Vivruti (Raghavendra Swami)</div>
                        <div class="commentary-text">${cleanText(verse.gita_vivruti)}</div>
                    </div>

                    <div class="commentary-block">
                        <div class="commentary-label">Gita Bhashya (Madhvacharya)</div>
                        <div class="commentary-text">${cleanText(verse.gita_bhashya)}</div>
                    </div>

                    <div class="commentary-block">
                        <div class="commentary-label">Gita Tatparya Nirnaya (Madhvacharya)</div>
                        <div class="commentary-text">${cleanText(verse.gita_tatparya)}</div>
                    </div>
                `;

                // Append the card to the main container
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
