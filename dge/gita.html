<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
<!-- Guru Vandana guard: bounces anyone arriving by bookmark or deep link
     back to the vandana at the site root. Must stay the first script here. -->
<script src="js/vandana-guard.js?v=1"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gita Viewer</title>
  <style>
    :root{--bg:#f7f7fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--ok:#166534;--err:#b91c1c;--border:#e5e7eb;--accent:#2563eb}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
    .wrap{max-width:900px;margin:0 auto;padding:24px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.04);padding:20px}
    h1{margin:0 0 8px;font-size:1.6rem}
    .meta{color:var(--muted);margin-bottom:16px}
    .status{padding:12px 14px;border-radius:10px;margin:14px 0;font-weight:600}
    .status.ok{background:#ecfdf5;color:var(--ok);border:1px solid #bbf7d0}
    .status.err{background:#fef2f2;color:var(--err);border:1px solid #fecaca}
    .controls{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
    button{border:1px solid var(--border);background:#fff;color:var(--text);padding:10px 14px;border-radius:10px;cursor:pointer}
    button:hover{border-color:var(--accent)}
    .verse-count{font-weight:700;color:var(--accent)}
    #output{margin-top:18px;display:grid;gap:12px}
    .verse{padding:14px;border:1px solid var(--border);border-radius:12px;background:#fafafa}
    .verse h3{margin:0 0 8px;font-size:1rem}
    .label{font-size:.85rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:10px}
    pre{white-space:pre-wrap;word-wrap:break-word;margin:6px 0 0;font-family:inherit}
    .small{font-size:.92rem;color:var(--muted)}
  </style>
<!-- Genie favicon -- the round Brahmana murti (gopichandana urdhvapundra, angara, akshata), cropped from the Genie avatar itself; project-lead ask. Root /favicon.ico covers auto-discovery. -->
<link rel="icon" type="image/png" sizes="48x48" href="../dge/images/genie/favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="../dge/images/genie/favicon-192.png">
<link rel="apple-touch-icon" href="../dge/images/genie/apple-touch-icon.png">
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div style="font-size:.85rem;margin:0 0 10px;color:var(--muted)"><a href="index.html" title="DGE Home" style="color:var(--accent);text-decoration:none;font-weight:700">⌂ DGE</a><span style="opacity:.6;margin:0 6px">›</span><b style="color:var(--text)">Gītā</b></div>
      <h1 id="title">Gita Viewer</h1>
      <div class="meta" id="meta">Loading JSON from the same directory...</div>
      <div id="status" class="status">Initializing...</div>
      <div class="controls">
        <button id="reloadBtn" type="button">Reload</button>
        <button id="toggleBtn" type="button">Show/Hide verses</button>
      </div>
      <div class="small">Slokas loaded: <span class="verse-count" id="count">0</span></div>
      <div id="output"></div>
    </div>
  </div>

  <script>
    const titleEl = document.getElementById('title');
    const metaEl = document.getElementById('meta');
    const statusEl = document.getElementById('status');
    const countEl = document.getElementById('count');
    const outputEl = document.getElementById('output');
    const reloadBtn = document.getElementById('reloadBtn');
    const toggleBtn = document.getElementById('toggleBtn');
    let visible = true;

    function setStatus(message, ok) {
      statusEl.textContent = message;
      statusEl.className = 'status ' + (ok ? 'ok' : 'err');
    }

    function cleanText(value) {
      return String(value ?? '').replace(/[span_d+](start_span)|[span_d+](end_span)/g, '').trim();
    }

    function renderData(data) {
      const verses = Array.isArray(data.verses) ? data.verses : [];
      titleEl.textContent = cleanText(data.title || 'Gita Viewer');
      metaEl.textContent = `Chapter ${data.chapter ?? ''}`.trim();
      countEl.textContent = String(verses.length);
      setStatus(`File loaded successfully. ${verses.length} slokas found.`, true);
      outputEl.innerHTML = verses.map(v => `
        <div class="verse">
          <h3>${cleanText(v.verse_numbers || '')}</h3>
          <div class="label">Shloka</div>
          <pre>${cleanText(v.shloka || '')}</pre>
          <div class="label">Gita Vivruti</div>
          <pre>${cleanText(v.gita_vivruti || '')}</pre>
        </div>
      `).join('');
    }

    async function loadJson() {
      setStatus('Loading gita.json...', true);
      metaEl.textContent = 'Loading JSON from the same directory...';
      outputEl.innerHTML = '';
      countEl.textContent = '0';
      try {
        const res = await fetch('gita.json', { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
        const data = await res.json();
        renderData(data);
      } catch (err) {
        setStatus(`Error loading file: ${err.message}`, false);
        metaEl.textContent = 'Could not load gita.json';
      }
    }

    reloadBtn.addEventListener('click', loadJson);
    toggleBtn.addEventListener('click', () => {
      visible = !visible;
      outputEl.style.display = visible ? 'grid' : 'none';
      toggleBtn.textContent = visible ? 'Hide verses' : 'Show verses';
    });

    loadJson();
  </script>
</body>
</html>
