<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhagavad Gita - Chapter 1</title>
    <style>
        /* Base Styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        #gita-container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Typography */
        h1 {
            text-align: center;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        /* Loading, Success & Error States */
        #status-message {
            text-align: center;
            font-size: 1.1em;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 30px;
            background-color: #ecf0f1;
            color: #7f8c8d;
            border: 1px solid #bdc3c7;
        }

        .success-text {
            color: #27ae60;
            font-weight: 500;
        }

        .error-text {
            color: #e74c3c;
            font-weight: 500;
        }

        /* Card Layout for Verses */
        .verse-card {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            padding: 25px;
            margin-bottom: 30px;
            border-left: 5px solid #e67e22;
        }

        .verse-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .verse-number {
            font-size: 1.2em;
            font-weight: bold;
            color: #d35400;
        }

        .shloka {
            font-size: 1.3em;
            color: #2980b9;
            font-weight: 500;
            margin-bottom: 20px;
            white-space: pre-wrap;
        }

        /* Commentaries Section */
        .commentary-block {
            margin-bottom: 15px;
            background: #fdfefe;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #e5e8e8;
        }

        .commentary-label {
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7f8c8d;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .commentary-text {
            color: #444;
            font-size: 1em;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <div id="gita-container">
        <!-- Status message -->
        <div id="status-message">Loading sacred texts...</div>
        
        <!-- The actual verses will be appended here -->
        <div id="content-area"></div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const statusMessage = document.getElementById('status-message');
            const contentArea = document.getElementById('content-area');

            // Force the browser to skip cache by appending a timestamp query string
            const jsonUrl = 'gita.json?nocache=' + new Date().getTime();

            fetch(jsonUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! Status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    try {
                        // Render the verses into the content area
                        renderGita(data, contentArea);
                        
                        // Calculate total shlokas in the array
                        const totalShlokas = (data.verses && Array.isArray(data.verses)) ? data.verses.length : 0;
                        
                        // Update the status message on success
                        statusMessage.innerHTML = `<span class="success-text">✓ <strong>gita.json</strong> loaded successfully! Displaying a list of <strong>${totalShlokas}</strong> shlokas.</span>`;
                        statusMessage.style.backgroundColor = "#eafaf1"; 
                        statusMessage.style.border = "1px solid #2ecc71";
                    } catch (renderError) {
                        console.error("Rendering Error:", renderError);
                        statusMessage.innerHTML = `<span class="error-text">✗ JSON fetched, but failed to render. Error: ${renderError.message}</span>`;
                        statusMessage.style.backgroundColor = "#fdedec"; 
                        statusMessage.style.border = "1px solid #e74c3c";
                    }
                })
                .catch(error => {
                    console.error("Fetch Error:", error);
                    statusMessage.innerHTML = `<span class="error-text">✗ Failed to load <strong>gita.json</strong>. Error: ${error.message}</span>`;
                    statusMessage.style.backgroundColor = "#fdedec"; 
                    statusMessage.style.border = "1px solid #e74c3c";
                });
        });

        // Function to safely remove tags
        function cleanText(text) {
            if (!text) return "Not provided";
            // Uses a safe regular expression to strip out [span_2](start_span)"[span_2](end_span)", [span_3](start_span)"[span_3](end_span)", etc.
            return text.replace(/\/g, '').trim();
        }

        // Function to render the JSON data into HTML
        function renderGita(gitaData, container) {
            // Add the Chapter Title
            const header = document.createElement('h1');
            const chapterNum = gitaData.chapter || '';
            const chapterTitle = cleanText(gitaData.title) || 'Unknown Title';
            header.textContent = `Chapter ${chapterNum}: ${chapterTitle}`; 
            container.appendChild(header);

            // Loop through each verse and create a card for the list
            if (gitaData.verses && Array.isArray(gitaData.verses)) {
                gitaData.verses.forEach(verse => {
                    const card = document.createElement('div');
                    card.className = 'verse-card';

                    // Construct the HTML for the card
                    card.innerHTML = `
                        <div class="verse-header">
                            <span class="verse-number">Verse ${verse.verse_numbers || 'Unknown'}</span>
                        </div>
                        <div class="shloka">${cleanText(verse.shloka)}</div>
                        
                        <div class="commentary-block">
                            <div class="commentary-label">Gita Vivruti (Raghavendra Swami)</div>
                            <div class="commentary-text">${cleanText(verse.gita_vivruti)}</div>
                        </div>

                        <div class="commentary-block">
                            <div class="commentary-label">Gita Bhashya (Madhvacharya)</div>
                            <div class="commentary-text">${cleanText(verse.gita_bhashya)}</div>
                        </div>

                        <div class="commentary-block">
                            <div class="commentary-label">Gita Tatparya Nirnaya (Madhvacharya)</div>
                            <div class="commentary-text">${cleanText(verse.gita_tatparya)}</div>
                        </div>
                    `;

                    // Append the card to the content container
                    container.appendChild(card);
                });
            } else {
                container.innerHTML = "<p>No verses found in the JSON file.</p>";
            }
        }
    </script>
</body>
</html>
