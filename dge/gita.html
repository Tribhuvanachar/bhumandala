<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhagavad Gita - Chapter 1</title>
    <style>
        /* Base Styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        #gita-container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Diagnostic Log Area */
        #log-area {
            background-color: #1e1e1e;
            color: #d4d4d4;
            font-family: Consolas, monospace;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 0.9em;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .log-info { color: #569cd6; } /* Blueish */
        .log-success { color: #4ec9b0; font-weight: bold; } /* Greenish */
        .log-error { color: #f44336; font-weight: bold; } /* Red */

        /* Typography */
        h1 {
            text-align: center;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        /* Card Layout for Verses */
        .verse-card {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            padding: 25px;
            margin-bottom: 30px;
            border-left: 5px solid #e67e22;
        }

        .verse-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .verse-number {
            font-size: 1.2em;
            font-weight: bold;
            color: #d35400;
        }

        .shloka {
            font-size: 1.3em;
            color: #2980b9;
            font-weight: 500;
            margin-bottom: 20px;
            white-space: pre-wrap;
        }

        /* Commentaries Section */
        .commentary-block {
            margin-bottom: 15px;
            background: #fdfefe;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #e5e8e8;
        }

        .commentary-label {
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7f8c8d;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .commentary-text {
            color: #444;
            font-size: 1em;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <div id="gita-container">
        <!-- Diagnostic Logging Area -->
        <div id="log-area"></div>
        
        <!-- The actual verses will be appended here -->
        <div id="content-area"></div>
    </div>

    <script>
        // Diagnostic Logger
        const logArea = document.getElementById('log-area');
        
        function addLog(message, type = 'log-info') {
            const div = document.createElement('div');
            div.className = type;
            const time = new Date().toLocaleTimeString();
            div.textContent = `[${time}] ${message}`;
            logArea.appendChild(div);
            console.log(`[${time}] ${message}`); // Also log to browser console
        }

        // Safe text cleaner (Fixed the previous Syntax Error here)
        function cleanTextSafely(text) {
            if (!text) return "Not provided";
            // Removes[span_1](start_span)[span_1](end_span),[span_2](start_span)[span_2](end_span), etc., safely.
            return text.replace(/\/g, '').trim();
        }

        document.addEventListener("DOMContentLoaded", () => {
            const contentArea = document.getElementById('content-area');

            addLog("Script initialized. DOM Content Loaded.", "log-info");

            // Build the absolute URL to ensure we fetch from the correct place
            const currentUrl = window.location.href;
            const baseUrl = currentUrl.substring(0, currentUrl.lastIndexOf('/'));
            const jsonUrl = `${baseUrl}/gita.json?nocache=${new Date().getTime()}`; // Bypass cache

            addLog(`Attempting to load file from URL: \n${jsonUrl}`, "log-info");

            fetch(jsonUrl)
                .then(response => {
                    addLog(`Fetch response received. HTTP Status: ${response.status} ${response.statusText}`, response.ok ? "log-success" : "log-error");
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! Status: ${response.status} - ${response.statusText}`);
                    }
                    // Read as text first so we can log file details before parsing
                    return response.text(); 
                })
                .then(textData => {
                    addLog(`File successfully fetched. Content length: ${textData.length} characters.`, "log-success");
                    
                    try {
                        addLog("Attempting to parse JSON data...", "log-info");
                        const data = JSON.parse(textData);
                        addLog("JSON parsed successfully.", "log-success");

                        // Count the shlokas
                        let totalShlokas = 0;
                        if (data.verses && Array.isArray(data.verses)) {
                            totalShlokas = data.verses.length;
                        }
                        
                        addLog(`Number of shlokas read from JSON: ${totalShlokas}`, "log-success");
                        addLog("Starting HTML rendering process...", "log-info");

                        // Render the content
                        renderGita(data, contentArea);
                        
                        addLog("HTML rendering complete! You should see the texts below.", "log-success");

                    } catch (parseError) {
                        addLog(`CRITICAL ERROR parsing JSON: ${parseError.message}`, "log-error");
                    }
                })
                .catch(fetchError => {
                    addLog(`CRITICAL NETWORK/FETCH ERROR: ${fetchError.message}`, "log-error");
                });
        });

        // Function to render the JSON data into HTML
        function renderGita(gitaData, container) {
            try {
                // Add the Chapter Title
                const header = document.createElement('h1');
                const chapterNum = gitaData.chapter || '';
                const chapterTitle = cleanTextSafely(gitaData.title) || 'Unknown Title';
                header.textContent = `Chapter ${chapterNum}: ${chapterTitle}`; 
                container.appendChild(header);

                // Loop through each verse and create a card for the list
                if (gitaData.verses && Array.isArray(gitaData.verses)) {
                    gitaData.verses.forEach(verse => {
                        const card = document.createElement('div');
                        card.className = 'verse-card';

                        card.innerHTML = `
                            <div class="verse-header">
                                <span class="verse-number">Verse ${verse.verse_numbers || 'Unknown'}</span>
                            </div>
                            <div class="shloka">${cleanTextSafely(verse.shloka)}</div>
                            
                            <div class="commentary-block">
                                <div class="commentary-label">Gita Vivruti (Raghavendra Swami)</div>
                                <div class="commentary-text">${cleanTextSafely(verse.gita_vivruti)}</div>
                            </div>

                            <div class="commentary-block">
                                <div class="commentary-label">Gita Bhashya (Madhvacharya)</div>
                                <div class="commentary-text">${cleanTextSafely(verse.gita_bhashya)}</div>
                            </div>

                            <div class="commentary-block">
                                <div class="commentary-label">Gita Tatparya Nirnaya (Madhvacharya)</div>
                                <div class="commentary-text">${cleanTextSafely(verse.gita_tatparya)}</div>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                } else {
                    addLog("Warning: No 'verses' array found in the JSON structure.", "log-error");
                }
            } catch (renderError) {
                addLog(`CRITICAL RENDER ERROR: ${renderError.message}`, "log-error");
            }
        }
    </script>
</body>
</html>
