<!DOCTYPE html>
<html lang="sa" data-theme="light">
<head>
<meta charset="utf-8">
<!-- Guru Vandana guard: bounces anyone arriving by bookmark or deep link
     back to the vandana at the site root. Must stay the first script here. -->
<script src="js/vandana-guard.js?v=1"></script>
<script src="js/contact-email.js?v=1"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>काव्यानि — DGE</title>
<meta name="description" content="Layered Sanskrit kavya reader: mula, traditional tika, padaccheda, anvaya and translation, side by side.">
<link rel="stylesheet" href="css/kavya.css">
</head>
<body>

<header class="top">
  <div class="row">
    <div class="brand"><a href="index.html" title="DGE Home">⌂ DGE</a><span style="opacity:.6;font-weight:400">›</span>काव्यानि <small id="totals">…</small></div>

    <nav class="seg" aria-label="Related tools">
      <a class="btn" href="ashtadhyayi.html" style="border:0;border-radius:0">सूत्राणि</a>
      <a class="btn" href="dhatu.html" style="border:0;border-radius:0">धातु</a>
    </nav>

    <div class="seg" role="group" aria-label="Script">
      <button type="button" data-script="deva">देव</button>
      <button type="button" data-script="iast">IAST</button>
      <button type="button" data-script="kn">ಕನ್ನಡ</button>
    </div>

    <div class="seg" role="group" aria-label="Mode">
      <button type="button" data-mode="read">पठनम् · Read</button>
      <button type="button" data-mode="compare">तुलना · Compare</button>
    </div>

    <button class="btn" id="smaller" type="button" aria-label="Smaller text">A−</button>
    <button class="btn" id="bigger"  type="button" aria-label="Larger text">A+</button>
    <button class="btn" id="theme"   type="button" aria-label="Toggle dark mode">◐</button>
  </div>
</header>

<main class="wrap">
  <div class="pickers">
    <label class="sr" for="workSel">Work</label>
    <select class="btn" id="workSel" style="max-width:min(60vw,380px)"></select>

    <label class="sr" for="unitSel">Sarga / Anka / Ullasa</label>
    <select class="btn" id="unitSel" style="max-width:min(45vw,300px)"></select>

    <form class="jump" id="jumpForm">
      <label class="sr" for="jumpInput">Jump to verse</label>
      <input id="jumpInput" placeholder="1.17  ( / )" inputmode="decimal">
      <button class="btn" type="submit">→</button>
    </form>
  </div>

  <div class="layerbar" id="layerBar" role="group" aria-label="Layers"></div>

  <section id="verses"></section>
</main>

<footer class="pager">
  <button class="btn" id="prev" type="button">← पूर्वम्</button>
  <span class="unit" id="unitNow"></span>
  <button class="btn" id="next" type="button">अग्रिमम् →</button>
</footer>

<!-- Filled by site-footer.js, shared with the landing page and reader
     (see that file's own header comment). -->
<div class="site-footer-links" id="siteFooterLinks"></div>

<script src="js/site-footer.js?v=1"></script>
<script src="js/kavya.js?v=4.67.0"></script>
</body>
</html>
