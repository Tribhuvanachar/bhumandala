<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>DGE OCR v0.1</title>
<link rel="stylesheet" href="style.css"></head>
<body>
<h2>DGE OCR Prototype</h2>
<label>Vision API Key</label><br><input id="visionKey" type="password"><br>
<label>Gemini API Key</label><br><input id="geminiKey" type="password"><br><br>
<input id="pdfFile" type="file" accept=".pdf,.docx,image/*"><br><br>
<button id="saveKeys">Save Keys</button>
<button id="runOCR">Run OCR</button>
<button id="proofread">Proofread with Gemini</button>
<button id="render">Render Preview</button>
<h3>Raw OCR JSON</h3><textarea id="ocrJson"></textarea>
<h3>Extracted Text</h3><textarea id="ocrText"></textarea>
<h3>Final JSON</h3><textarea id="finalJson"></textarea>
<h3>Preview</h3><div id="preview"></div>
<script src="app.js"></script>
</body></html>
