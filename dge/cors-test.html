<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DGE Convert — Vision API CORS Test</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 20px auto; padding: 0 16px; line-height: 1.5; }
  h2 { margin-bottom: 4px; }
  .sub { color: #666; font-size: 13px; margin-bottom: 20px; }
  label { display: block; font-weight: 700; font-size: 13px; margin: 16px 0 4px; }
  input[type="password"], input[type="text"] { width: 100%; box-sizing: border-box; padding: 8px; font-size: 14px; }
  input[type="file"] { margin-top: 4px; }
  button { margin-top: 16px; padding: 10px 20px; font-size: 15px; font-weight: 700; cursor: pointer; }
  #result { margin-top: 20px; padding: 14px; border-radius: 6px; white-space: pre-wrap; font-family: monospace; font-size: 13px; display: none; }
  .ok { background: #e6f4ea; border: 1px solid #34a853; color: #1e4620; }
  .cors-fail { background: #fce8e6; border: 1px solid #ea4335; color: #5f1a13; }
  .api-fail { background: #fef7e0; border: 1px solid #f9ab00; color: #5c4200; }
  #preview { max-width: 100%; margin-top: 10px; border: 1px solid #ccc; display: none; }
</style>
</head>
<body>

<h2>Vision API — CORS Test</h2>
<div class="sub">Settles one question before anything else gets built: does Google Cloud Vision accept a direct call from this browser, or does it need a backend proxy? Takes under a minute.</div>

<label for="apiKey">Vision API Key</label>
<input type="password" id="apiKey" placeholder="Paste your key here" autocomplete="off">

<label for="imgFile">Test Image (any photo with some text in it works)</label>
<input type="file" id="imgFile" accept="image/*">
<img id="preview">

<button id="runBtn">Run Test</button>

<div id="result"></div>

<script>
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.substring(reader.result.indexOf(',') + 1));
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

document.getElementById('imgFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  const preview = document.getElementById('preview');
  if (file) {
    preview.src = URL.createObjectURL(file);
    preview.style.display = 'block';
  }
});

document.getElementById('runBtn').addEventListener('click', async () => {
  const apiKey = document.getElementById('apiKey').value.trim();
  const file = document.getElementById('imgFile').files[0];
  const resultEl = document.getElementById('result');

  resultEl.style.display = 'block';
  resultEl.className = '';
  resultEl.textContent = 'Running…';

  if (!apiKey) {
    resultEl.className = 'api-fail';
    resultEl.textContent = 'Paste a Vision API key first.';
    return;
  }
  if (!file) {
    resultEl.className = 'api-fail';
    resultEl.textContent = 'Choose a test image first.';
    return;
  }

  try {
    const base64 = await fileToBase64(file);
    const url = `https://vision.googleapis.com/v1/images:annotate?key=${encodeURIComponent(apiKey)}`;
    const body = {
      requests: [{
        image: { content: base64 },
        features: [{ type: 'TEXT_DETECTION' }]
      }]
    };

    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    // If we get here at all, CORS did NOT block us — the browser was
    // able to read the response, whatever its status code.
    const data = await res.json();

    if (!res.ok) {
      resultEl.className = 'api-fail';
      resultEl.textContent =
        `GOOD NEWS: This is NOT a CORS problem. The browser successfully reached Vision API and read its response.\n\n` +
        `But the request itself failed (HTTP ${res.status}):\n` +
        JSON.stringify(data, null, 2) +
        `\n\nThis is almost certainly a key/billing/quota issue on the Google Cloud side, not an architecture problem. ` +
        `Common causes: Vision API not enabled on the project, billing not set up, or the key is restricted to specific origins/APIs.`;
      return;
    }

    const annotation = data.responses && data.responses[0];
    const text = annotation && annotation.fullTextAnnotation ? annotation.fullTextAnnotation.text : null;
    const err = annotation && annotation.error;

    if (err) {
      resultEl.className = 'api-fail';
      resultEl.textContent = `GOOD NEWS: No CORS problem — request succeeded at the network level.\n\nBut Vision API returned an error for this image:\n${JSON.stringify(err, null, 2)}`;
      return;
    }

    resultEl.className = 'ok';
    resultEl.textContent =
      `SUCCESS. Direct browser → Vision API calls work — no CORS block, no backend needed for OCR.\n\n` +
      `Extracted text from your test image:\n---\n${text || '(no text detected in this image — try one with visible text)'}\n---`;

  } catch (e) {
    // A thrown TypeError with no response object at all is the classic
    // signature of a CORS block (or a genuine network/DNS failure) — the
    // browser refused to hand the response to this script.
    resultEl.className = 'cors-fail';
    resultEl.textContent =
      `LIKELY CORS BLOCK (or network failure): ${e.message}\n\n` +
      `The browser threw this before any response could be read, which is the typical signature of Vision API refusing a direct cross-origin request. ` +
      `If this is what you're seeing, the "no backend" plan needs to change for the OCR step specifically — either a thin serverless proxy just for this call, or switching to a browser-native OCR library (e.g. Tesseract.js) instead of Vision API.\n\n` +
      `Double-check you're not on a flaky connection before concluding it's definitely CORS — try again once on stable wifi.`;
  }
});
</script>

</body>
</html>
