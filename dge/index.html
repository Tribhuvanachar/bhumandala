<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>Digital Grantha Engine</title>

<link rel="stylesheet" href="css/main.css">

</head>

<body>

<div style="background:#b71c1c;color:white;padding:8px;font-family:monospace">
DGE DEV BUILD 011
</div>

<header>

<h1 id="granthaTitle">
DGE v10.1.0 Alpha Build 011
</h1>

</header>

<main>

<section id="readerSection">

<div id="readerCard">
Loading...
</div>

</section>

<section id="navigationSection">

<button id="btnFirst">⏮</button>

<button id="btnPrevious">◀</button>

<button id="btnNext">▶</button>

<button id="btnLast">⏭</button>

</section>

<section id="searchSection">

<input
id="searchInput"
type="search"
placeholder="Search">

<div id="searchResults"></div>

</section>

<section id="audioSection">

<audio
id="audioPlayer"
controls>
</audio>

</section>

<section
id="commentaryPanel"
style="display:none;">
</section>

</main>

<textarea
id="debugLog"
style="
width:100%;
height:250px;
font-family:monospace;
font-size:12px;
margin-top:20px;">
</textarea>

<script>

const BUILD = Date.now();

const files = [

"js/granthaManager.js",
"js/datasetAdapter.js",
"js/granthaReader.js",
"js/granthaNavigator.js",
"js/granthaSearch.js",
"js/granthaAudio.js",
"js/granthaNotes.js",
"js/granthaBookmarks.js",
"js/granthaCommentary.js",
"index.js"

];

async function loadScriptsSequentially() {

    for (const file of files) {

        await new Promise((resolve, reject) => {

            const script = document.createElement("script");

            script.src = file + "?v=" + BUILD;

            script.onload = resolve;

            script.onerror = () => reject(
                new Error("Failed to load: " + file)
            );

            document.body.appendChild(script);

        });

    }

}

loadScriptsSequentially().catch(error => {

    console.error(error);

    const box = document.getElementById("debugLog");

    if (box) {

        box.value += error.message + "\n";

    }

});

</script>

</body>

</html>
