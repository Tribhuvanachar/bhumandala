<!DOCTYPE html>
<html lang="sa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Digital Grantha Engine</title>
<link rel="stylesheet" href="css/main.css">
<script src="https://unpkg.com/sanscript@0.1.3/sanscript.min.js"></script>
</head>
<body>
<div id="toastMsg"></div>

<!-- Top Bar -->
<div class="top-bar">
  <div class="top-bar-title" onclick="location.reload()">❮ Grantha Engine</div>
  <div class="top-actions">
    <button class="btn-top" onclick="togglePopup('commentaryPopup')">💬</button>
    <button class="btn-top" onclick="toggleDarkMode()">☀️</button>
    <button class="btn-top" onclick="togglePopup('scriptPopup')">🔠</button>
  </div>
</div>

<div class="app-container">
  <div class="header">
    <h1 id="stotraTitle">Loading Grantha...</h1>
    <div class="author" id="stotraAuthor">...</div>
    <div class="rule"></div>
  </div>

  <div class="search-box-group">
    <select id="searchScope" class="search-scope-select" onchange="handleSearch()">
      <option value="all">Search All</option>
      <option value="mula">Shloka Only</option>
    </select>
    <div class="search-container">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search text or shloka number..." oninput="handleSearch()">
      <button class="clear-search-btn" id="clearSearchBtn" onclick="clearSearch()">✖</button>
    </div>
  </div>

  <div class="reading-card" id="readingCard">Select a shloka</div>
  <div class="shloka-list" id="shlokaList"></div>
</div>

<!-- Layer B Modular Scripts -->
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/transliteration.js"></script>
<script src="js/render.js"></script>
<script src="js/audio.js"></script>
<script src="js/search.js"></script>
<script src="js/notes.js"></script>
<script src="js/snippets.js"></script>
<script src="js/markers.js"></script>
<script src="js/filter.js"></script>
<script src="js/modals.js"></script>
<script src="js/ai.js"></script>
<script src="js/core.js"></script>
</body>
</html>
