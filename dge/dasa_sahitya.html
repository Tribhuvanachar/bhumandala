<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="utf-8">
<!-- Guru Vandana guard: bounces anyone arriving by bookmark or deep link
     back to the vandana at the site root. Must stay the first script here. -->
<script src="js/vandana-guard.js?v=1"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ದಾಸ ಸಾಹಿತ್ಯ · Dāsa Sāhitya — DGE</title>
<style>
  :root{
    --bg:#faf7f2; --panel:#fff; --ink:#241c14; --muted:#7a6a58; --line:#e7ddcf;
    --accent:#9a3b1b; --accent2:#c47a2c; --chip:#f0e7d8; --chipOn:#9a3b1b; --ok:#2f7d4f; --warn:#b3421a;
    --shadow:0 1px 3px rgba(0,0,0,.08),0 6px 18px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#17130f;--panel:#211a14;--ink:#efe6d8;--muted:#a99b86;--line:#33291f;
      --accent:#e6915a;--accent2:#d7a24a;--chip:#2a2118;--chipOn:#e6915a;--ok:#68c68d;--warn:#e6915a;
      --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);}
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Noto Sans Kannada','Noto Serif',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5;-webkit-text-size-adjust:100%}
  header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--panel),color-mix(in srgb,var(--panel) 92%,transparent));
    backdrop-filter:blur(6px);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
  .wrap{max-width:1080px;margin:0 auto;padding:0 14px}
  .titrow{display:flex;align-items:baseline;gap:10px;padding:12px 0 6px;flex-wrap:wrap}
  h1{font-size:1.35rem;margin:0;letter-spacing:.2px}
  h1 small{font-weight:400;color:var(--muted);font-size:.8rem}
  .sub{color:var(--muted);font-size:.78rem;margin:0 0 8px}
  .stats{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:8px}
  .stat{background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:.78rem}
  .stat b{font-size:.95rem;color:var(--accent)}
  .controls{display:flex;gap:8px;flex-wrap:wrap;padding:6px 0 10px;align-items:center}
  input[type=search],select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:9px;
    background:var(--panel);color:var(--ink)}
  input[type=search]{flex:1;min-width:180px}
  .forms{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:10px}
  .chip{cursor:pointer;user-select:none;border:1px solid var(--line);background:var(--chip);color:var(--ink);
    border-radius:999px;padding:5px 11px;font-size:.8rem;display:inline-flex;gap:6px;align-items:center}
  .chip .n{background:rgba(0,0,0,.08);border-radius:999px;padding:0 7px;font-size:.72rem}
  @media(prefers-color-scheme:dark){.chip .n{background:rgba(255,255,255,.1)}}
  .chip[aria-pressed=true]{background:var(--chipOn);color:#fff;border-color:var(--chipOn)}
  .chip[aria-pressed=true] .n{background:rgba(255,255,255,.25)}
  main{max-width:1080px;margin:14px auto 60px;padding:0 14px;display:grid;grid-template-columns:250px 1fr;gap:18px}
  @media(max-width:760px){main{grid-template-columns:1fr}.side{order:2}}
  .side{position:sticky;top:150px;align-self:start;max-height:calc(100vh - 170px);overflow:auto;
    border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:8px;box-shadow:var(--shadow)}
  @media(max-width:760px){.side{position:static;max-height:none}}
  .side h3{margin:6px 6px 8px;font-size:.82rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .authbtn{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;cursor:pointer;
    border:0;background:none;color:var(--ink);font:inherit;padding:7px 8px;border-radius:8px}
  .authbtn:hover{background:var(--chip)}
  .authbtn[aria-current=true]{background:var(--chip);font-weight:600}
  .authbtn .n{color:var(--muted);font-size:.78rem;font-variant-numeric:tabular-nums}
  .authbtn .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;margin-top:6px;background:var(--line)}
  .authbtn .dot.loaded{background:var(--ok)} .authbtn .dot.err{background:var(--warn)}
  .grouphead{display:flex;align-items:center;gap:10px;margin:18px 0 8px}
  .grouphead h2{font-size:1.05rem;margin:0}
  .grouphead .n{color:var(--muted);font-size:.8rem}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:8px 0;box-shadow:var(--shadow);overflow:hidden}
  .card>summary{cursor:pointer;list-style:none;padding:11px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .card>summary::-webkit-details-marker{display:none}
  .card .t{font-weight:600;font-size:1rem}
  .card .tl{color:var(--muted);font-size:.82rem}
  .badge{font-size:.68rem;text-transform:uppercase;letter-spacing:.4px;padding:2px 8px;border-radius:999px;
    background:var(--chip);border:1px solid var(--line);color:var(--muted)}
  .badge.form{color:#fff;background:var(--accent2);border-color:transparent}
  .meta{color:var(--muted);font-size:.78rem;margin-left:auto}
  .body{padding:0 14px 14px;border-top:1px dashed var(--line)}
  .stanza{margin:12px 0;white-space:pre-wrap}
  .stanza .rom{color:var(--muted);font-size:.85rem}
  .meaning{margin-top:10px;padding:10px;background:var(--chip);border-radius:9px;font-size:.9rem}
  .src{font-size:.76rem;margin-top:10px}
  .src a{color:var(--accent)}
  .empty{padding:40px 16px;text-align:center;color:var(--muted)}
  .empty code{background:var(--chip);padding:2px 6px;border-radius:6px}
  .adminbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.78rem;color:var(--muted);
    border:1px dashed var(--line);border-radius:10px;padding:8px 10px;margin:10px 0}
  .bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden;flex:1;min-width:120px}
  .bar>i{display:block;height:100%;background:var(--ok);width:0}
  button.mini{font:inherit;font-size:.78rem;cursor:pointer;border:1px solid var(--line);background:var(--panel);
    color:var(--ink);border-radius:8px;padding:5px 10px}
  button.mini:hover{border-color:var(--accent)}
  .toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);
    padding:8px 14px;border-radius:10px;font-size:.82rem;opacity:0;transition:.25s;pointer-events:none;z-index:40}
  .toast.show{opacity:.95}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="titrow">
      <h1>ದಾಸ ಸಾಹಿತ್ಯ <small>Dāsa Sāhitya · Dasara Padagalu</small></h1>
    </div>
    <p class="sub">Haridasa padas, suladis &amp; ugabhogas · non-commercial · dharma-prachara / education / research</p>
    <div class="stats" id="stats"></div>
    <div class="forms" id="forms"></div>
    <div class="controls">
      <input type="search" id="q" placeholder="Search title, composer, deity, first line…" autocomplete="off">
      <select id="groupby" title="Group by">
        <option value="composer">Group: Composer</option>
        <option value="deity">Group: Deity</option>
        <option value="form">Group: Form</option>
        <option value="alpha">Group: A–Z (title)</option>
      </select>
      <select id="sort" title="Sort">
        <option value="az">Sort: A→Z</option>
        <option value="za">Sort: Z→A</option>
      </select>
      <select id="script" title="Script">
        <option value="kn">ಕನ್ನಡ</option>
        <option value="iast">IAST</option>
        <option value="devanagari">देवनागरी</option>
      </select>
    </div>
  </div>
</header>

<main>
  <aside class="side">
    <div class="adminbar" id="admin">
      <span id="adminlbl">Loading…</span>
      <span class="bar"><i id="adminbar"></i></span>
      <button class="mini" id="loadall">Load all</button>
    </div>
    <h3>Composers</h3>
    <div id="authlist"></div>
  </aside>
  <section id="list"><div class="empty">Loading corpus…</div></section>
</main>
<div class="toast" id="toast"></div>

<script>
"use strict";
const BASE = (window.DASA_DATA_BASE || "data/dasa_sahitya").replace(/\/$/,"");
const FORM_LABELS = {pada:"Pada",suladi:"Suladi",ugabhoga:"Ugabhoga",devaranama:"Devaranama",
  aarati:"Aarati",mangala:"Mangala",kolu:"Kolu",shobhane:"Shobhane",laali:"Laali",
  dashavatara:"Dashavatara",sampradaya:"Sampradaya",kavya:"Kavya",
  mundige:"Mundige",dandaka:"Dandaka",other:"Other"};

const state={manifest:null,records:[],loaded:{},form:"all",q:"",group:"composer",sort:"az",script:"kn",author:null};

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');
  clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1600);}
function prefGet(k,d){try{return JSON.parse(localStorage.getItem('dasa_'+k))??d}catch(e){return d}}
function prefSet(k,v){try{localStorage.setItem('dasa_'+k,JSON.stringify(v))}catch(e){}}

async function boot(){
  state.script=prefGet('script','kn'); document.getElementById('script').value=state.script;
  state.group=prefGet('group','composer'); document.getElementById('groupby').value=state.group;
  let man;
  try{ man=await (await fetch(BASE+"/index.json",{cache:"no-store"})).json(); }
  catch(e){ return showMissing(); }
  state.manifest=man;
  renderStats(); renderForms(); renderAuthors();
  // auto-load composer files (respect small corpora fully; large ones lazy on click + Load all)
  const comps=man.composers||[];
  if(comps.length<=8){ await loadAll(); }
  else { updateAdmin(); document.getElementById('list').innerHTML=
    '<div class="empty">Pick a composer on the left, or press <b>Load all</b> to load the full corpus.</div>'; }
}

function showMissing(){
  document.getElementById('stats').innerHTML='';
  document.getElementById('admin').style.display='none';
  document.getElementById('list').innerHTML=
    '<div class="empty">No corpus found at <code>'+BASE+'/index.json</code>.<br><br>'+
    'Run the Dasa Sahitya importer (Colab notebook or the GitHub Action) to generate it, '+
    'then reload this page.</div>';
}

function renderStats(){
  const m=state.manifest, byForm=m.counts_by_form||{}, bySrc=m.counts_by_source||{};
  const parts=[`<span class="stat"><b>${m.count_total||0}</b> compositions</span>`,
    `<span class="stat"><b>${(m.composers||[]).length}</b> composers</span>`];
  if(m.dedup && m.dedup.duplicates_merged)
    parts.push(`<span class="stat" title="cross-source duplicates merged">deduped −<b>${m.dedup.duplicates_merged}</b></span>`);
  Object.entries(bySrc).forEach(([s,n])=>
    parts.push(`<span class="stat">${s.replace(/\.(com|net|org)$/,'')}: <b>${n}</b></span>`));
  document.getElementById('stats').innerHTML=parts.join("");
  window._byFormManifest=byForm;
}

function renderForms(){
  const byForm=state.manifest.counts_by_form||{};
  const forms=Object.keys(FORM_LABELS).filter(f=>byForm[f]);
  const total=state.manifest.count_total||0;
  const chip=(f,lbl,n)=>`<button class="chip" data-form="${f}" aria-pressed="${state.form===f}">`+
    `${lbl}<span class="n">${n}</span></button>`;
  let html=chip("all","All",total);
  forms.forEach(f=>html+=chip(f,FORM_LABELS[f],byForm[f]));
  const el=document.getElementById('forms'); el.innerHTML=html;
  el.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{state.form=c.dataset.form;renderForms();render();});
}

function renderAuthors(){
  const comps=[...(state.manifest.composers||[])].sort((a,b)=>
    (a.composer||a.slug).localeCompare(b.composer||b.slug));
  const el=document.getElementById('authlist');
  el.innerHTML=comps.map(c=>{
    const ld=state.loaded[c.slug];
    const dot=ld==="ok"?"loaded":ld==="err"?"err":"";
    return `<button class="authbtn" data-slug="${c.slug}" aria-current="${state.author===c.slug}">`+
      `<span class="dot ${dot}"></span>`+
      `<span style="flex:1">${c.composer||c.slug}</span><span class="n">${c.count}</span></button>`;
  }).join("");
  el.querySelectorAll('.authbtn').forEach(b=>b.onclick=async()=>{
    state.author = state.author===b.dataset.slug ? null : b.dataset.slug;
    if(state.author) await loadComposer(state.author);
    renderAuthors(); render();
  });
}

async function loadComposer(slug){
  if(state.loaded[slug]==="ok") return;
  const entry=(state.manifest.composers||[]).find(c=>c.slug===slug);
  if(!entry) return;
  try{
    const data=await (await fetch(BASE+"/"+entry.file,{cache:"no-store"})).json();
    const recs=(data.compositions||[]).map(r=>({...r,_slug:slug}));
    // replace any existing records for this slug
    state.records=state.records.filter(r=>r._slug!==slug).concat(recs);
    state.loaded[slug]="ok";
  }catch(e){ state.loaded[slug]="err"; toast("Failed: "+slug); }
  updateAdmin();
}

async function loadAll(){
  const comps=state.manifest.composers||[];
  document.getElementById('loadall').disabled=true;
  for(const c of comps){ await loadComposer(c.slug); renderAuthors(); }
  document.getElementById('loadall').disabled=false;
  render(); toast("Loaded "+state.records.length+" compositions");
}

function updateAdmin(){
  const comps=state.manifest.composers||[];
  const okCount=comps.filter(c=>state.loaded[c.slug]==="ok").length;
  const loadedComps=comps.filter(c=>state.loaded[c.slug]==="ok");
  const compsExpected=loadedComps.reduce((s,c)=>s+c.count,0);
  const pct=comps.length? Math.round(okCount/comps.length*100):0;
  document.getElementById('adminbar').style.width=pct+"%";
  document.getElementById('adminlbl').textContent=
    `${okCount}/${comps.length} files · ${state.records.length} loaded`;
}

// --- rendering the composition list ---
function scriptTitle(r){
  const t=r.title||{};
  if(state.script==="iast") return t.iast||t.latin||t.kn||"(untitled)";
  if(state.script==="devanagari") return t.devanagari||t.kn||t.latin||"(untitled)";
  return t.kn||t.latin||"(untitled)";
}
function firstLine(r){const k=(r.text&&r.text.kannada)||[];return (k[0]&&k[0][0])||"";}
function stanzasFor(r){
  const T=r.text||{};
  if(state.script==="iast" && (T.iast||[]).some(s=>s.length)) return T.iast;
  if(state.script==="devanagari" && (T.devanagari||[]).some(s=>s.length)) return T.devanagari;
  return T.kannada||[];
}

function matches(r){
  if(state.form!=="all" && r.form!==state.form) return false;
  if(state.q){
    const q=state.q.toLowerCase();
    const hay=[scriptTitle(r),r.composer,r.deity,(r.title&&r.title.iast),firstLine(r),
      (r.tags||[]).join(" ")].join(" ").toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}

function groupKey(r){
  if(state.group==="deity") return r.deity||"—";
  if(state.group==="form") return FORM_LABELS[r.form]||r.form;
  if(state.group==="alpha"){const t=scriptTitle(r);return (t[0]||"#").toUpperCase();}
  return r.composer||"—";
}

function render(){
  const list=document.getElementById('list');
  let recs=state.records.filter(matches);
  if(state.author) recs=recs.filter(r=>r._slug===state.author);
  const dir=state.sort==="za"?-1:1;
  recs.sort((a,b)=>dir*scriptTitle(a).localeCompare(scriptTitle(b),'kn'));

  if(!recs.length){
    const loadedAny=Object.values(state.loaded).includes("ok");
    list.innerHTML='<div class="empty">'+(loadedAny?
      'No compositions match your filters.':
      'Nothing loaded yet — pick a composer or press <b>Load all</b>.')+'</div>';
    return;
  }
  const groups={};
  recs.forEach(r=>{(groups[groupKey(r)] ||= []).push(r);});
  const keys=Object.keys(groups).sort((a,b)=>dir*a.localeCompare(b,'kn'));
  let html="";
  keys.forEach(k=>{
    html+=`<div class="grouphead"><h2>${k}</h2><span class="n">${groups[k].length}</span></div>`;
    groups[k].forEach(r=>html+=cardHtml(r));
  });
  list.innerHTML=html;
}

function cardHtml(r){
  const title=scriptTitle(r), il=r.title&&r.title.iast;
  const stz=stanzasFor(r), roman=(r.text&&r.text.source_roman)||[];
  let body="";
  stz.forEach((st,i)=>{
    body+='<div class="stanza">'+st.join("\n");
    if(state.script==="kn" && roman[i]) body+='\n<span class="rom">'+roman[i].join("\n")+'</span>';
    body+='</div>';
  });
  if(r.meaning) body+='<div class="meaning"><b>ಅರ್ಥ / Meaning</b><br>'+esc(r.meaning)+'</div>';
  const src=r.source||{};
  if(src.url) body+='<div class="src">Source: <a href="'+src.url+'" target="_blank" rel="noopener">'+
    (src.site||src.url)+'</a></div>';
  return `<details class="card"><summary>`+
    `<span class="badge form">${FORM_LABELS[r.form]||r.form}</span>`+
    `<span class="t">${esc(title)}</span>`+
    (il&&state.script!=="iast"?`<span class="tl">${esc(il)}</span>`:"")+
    `<span class="meta">${esc(r.composer||"")}${r.deity?" · "+esc(r.deity):""}</span>`+
    `</summary><div class="body">${body||'<p class="tl">No verse text captured.</p>'}</div></details>`;
}
function esc(s){return (s||"").replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

// wire controls
document.getElementById('q').oninput=e=>{state.q=e.target.value.trim();render();};
document.getElementById('groupby').onchange=e=>{state.group=e.target.value;prefSet('group',state.group);render();};
document.getElementById('sort').onchange=e=>{state.sort=e.target.value;render();};
document.getElementById('script').onchange=e=>{state.script=e.target.value;prefSet('script',state.script);renderAuthors();render();};
document.getElementById('loadall').onclick=loadAll;

boot();
</script>
</body>
</html>
